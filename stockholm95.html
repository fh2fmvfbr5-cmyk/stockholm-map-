<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">

<title>Stockholm '95</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;user-select:none}
#c{display:block;width:100vw;height:100vh}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:999;padding:20px}
#loading h1{color:#cc2222;font-size:16px;letter-spacing:8px;text-shadow:0 0 20px #cc222299}
#loading-sub{color:#ffdd44;font-size:10px;letter-spacing:4px}
#lbar{width:240px;height:2px;background:#1a1a1a}
#lfill{height:2px;background:#cc2222;width:0;transition:width .2s}
#l-tip{color:#ffffff33;font-size:9px;letter-spacing:2px;text-align:center}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;display:none}

#health-wrap{position:fixed;bottom:82px;left:18px}
#health-label{color:#cc2222;font-size:9px;letter-spacing:2px;margin-bottom:2px}
#health-bar{width:140px;height:8px;background:#1a0000;border:1px solid #cc222266}
#health-fill{height:100%;background:linear-gradient(90deg,#cc2222,#ff4444);transition:width .15s}
#armor-bar{width:140px;height:5px;background:#001a00;border:1px solid #22cc2266;margin-top:2px}
#armor-fill{height:100%;background:#22cc66;transition:width .15s}

#money{position:fixed;bottom:100px;right:18px;color:#ffdd44;font-size:14px;letter-spacing:2px;text-align:right;text-shadow:0 0 8px #ffdd4466}
#wanted-wrap{position:fixed;bottom:80px;right:18px;display:flex;gap:3px}
.star{color:#333;font-size:20px;line-height:1}.star.on{color:#ffdd44;text-shadow:0 0 10px #ffdd44}

#weapon-box{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  text-align:center;color:#fff;font-size:10px;letter-spacing:2px}
#weapon-name{color:#ffdd44;font-size:11px}
#weapon-ammo{color:#aaa;font-size:10px;margin-top:2px}

#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#ffffff88;font-size:16px;pointer-events:none;display:none}

#area-txt{position:fixed;top:18px;left:50%;transform:translateX(-50%);
  color:#ffffff66;font-size:9px;letter-spacing:5px;transition:opacity .5s}
#mission-box{position:fixed;top:50px;left:50%;transform:translateX(-50%);
  color:#ffdd44;font-size:10px;letter-spacing:2px;text-align:center;
  text-shadow:0 0 8px #ffdd4499;max-width:80vw;line-height:1.7;transition:opacity .5s}
#objective{position:fixed;top:18px;right:18px;color:#ffffff88;font-size:9px;
  letter-spacing:1px;text-align:right;line-height:1.8;max-width:200px}

#minimap{position:fixed;bottom:18px;right:18px;border:1px solid #ffffff22}

#radio-box{position:fixed;top:18px;left:18px;color:#aaffaa;font-size:9px;
  letter-spacing:1px;background:rgba(0,0,0,.5);padding:4px 8px;
  border:1px solid #22441133;line-height:1.7}

#speed-box{position:fixed;bottom:82px;left:170px;color:#aaddff;font-size:11px;
  letter-spacing:2px;display:none}

/* ── DIALOGUE ── */
#dialogue{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.88);
  border-top:1px solid #cc222266;padding:16px 20px;display:none;pointer-events:all;z-index:50}
#dlg-portrait{width:60px;height:60px;border:1px solid #cc222266;float:left;margin-right:14px}
#dlg-name{color:#ffdd44;font-size:10px;letter-spacing:3px;margin-bottom:6px}
#dlg-text{color:#fff;font-size:11px;line-height:1.7;letter-spacing:1px}
#dlg-close{position:absolute;top:10px;right:14px;color:#cc2222;cursor:pointer;
  font-size:12px;letter-spacing:2px}

/* ── SHOP ── */
#shop{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;
  align-items:center;justify-content:center;z-index:60;pointer-events:all}
#shop-inner{border:1px solid #cc222266;padding:24px;min-width:280px;max-width:90vw}
#shop-title{color:#cc2222;font-size:13px;letter-spacing:4px;margin-bottom:16px}
.shop-item{color:#fff;font-size:10px;letter-spacing:1px;padding:8px 0;
  border-bottom:1px solid #222;cursor:pointer;display:flex;justify-content:space-between}
.shop-item:hover{color:#ffdd44}
.shop-item .price{color:#ffdd44}
#shop-close{margin-top:16px;color:#cc2222;font-size:9px;cursor:pointer;letter-spacing:3px}
#shop-money{color:#ffdd44;font-size:11px;margin-bottom:12px}

/* ── MOBILE CONTROLS ── */
#mobile{position:fixed;bottom:0;left:0;right:0;height:200px;
  pointer-events:none;display:none;z-index:20}
.jbase{position:absolute;width:100px;height:100px;border-radius:50%;
  border:2px solid #ffffff22;background:rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;pointer-events:all}
.jknob{width:40px;height:40px;border-radius:50%;background:#ffffff33;pointer-events:none}
#jL{bottom:30px;left:24px}
#jR{bottom:30px;right:24px}
.mbtn{position:absolute;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;letter-spacing:1px;pointer-events:all;
  color:#fff;cursor:pointer;border:2px solid}
#bShoot{width:56px;height:56px;bottom:100px;right:150px;background:rgba(180,20,20,.7);border-color:#ff4444}
#bSprint{width:46px;height:46px;bottom:32px;left:148px;background:rgba(0,0,0,.6);border-color:#ffffff33}
#bEnter{width:46px;height:46px;bottom:100px;left:148px;background:rgba(0,80,180,.6);border-color:#4488ff}
#bCam{width:40px;height:40px;bottom:155px;right:24px;background:rgba(0,0,0,.6);border-color:#ffffff22;font-size:12px}
#bWeapon{width:40px;height:40px;bottom:155px;right:80px;background:rgba(0,0,0,.6);border-color:#ffdd4444}

/* ── SCANLINES ── */
#scan{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:.02;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,#000 2px,#000 3px)}

/* ── DEATH SCREEN ── */
#deathscreen{position:fixed;inset:0;background:rgba(150,0,0,.0);display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  z-index:900;transition:background 1s}
#deathscreen.show{background:rgba(0,0,0,.88)}
#death-txt{color:#cc2222;font-size:18px;letter-spacing:6px;display:none}
#death-sub{color:#ffffff66;font-size:10px;letter-spacing:3px;display:none}
#death-btn{background:rgba(0,0,0,.8);border:1px solid #cc222266;color:#cc2222;
  padding:10px 24px;font-size:10px;letter-spacing:3px;cursor:pointer;
  font-family:'Courier New',monospace;display:none}
</style>
</head>

  {id:'m1',title:'UPPDRAGET BÖRJAR',giver:'BALKAN BOSS',faction:'balkan',
   text:'Det är ett paket vid Slussen. Hämta det och leverera till Hornstull. Fort.',

  {name:'SLUSSEN',x:0,z:0,r:70},

// ── Radio stations ────────────────────────────────────────────
var RADIO=[

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
function init(){
  lp(5,'STARTAR MOTOR...');
  clock = new THREE.Clock();

  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x060810);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080c14,0.011);
  scene.background = new THREE.Color(0x060810);

  camera = new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,600);

  // Lights
  scene.add(new THREE.AmbientLight(0x1a2233,1.0));
  var moon=new THREE.DirectionalLight(0x5577aa,0.7);
  moon.position.set(60,100,40);moon.castShadow=true;
  moon.shadow.mapSize.set(2048,2048);
  moon.shadow.camera.near=1;moon.shadow.camera.far=500;
  moon.shadow.camera.left=moon.shadow.camera.bottom=-220;
  moon.shadow.camera.right=moon.shadow.camera.top=220;
  scene.add(moon);
  scene.add(new THREE.DirectionalLight(0x221133,0.3).position.set(-30,20,-40));

  lp(12,'BYGGER STAD...');
  buildWorld();
  lp(45,'TUNNELBANA...');
  buildSubway();
  lp(58,'SPELARE...');
  spawnPlayer();
  lp(68,'NPC...');
  spawnAllNPCs();
  lp(78,'FORDON...');
  spawnAllVehicles();
  lp(86,'PICKUPS...');
  spawnPickups();
  lp(93,'UPPDRAG...');
  spawnMissionMarkers();
  lp(98,'KONTROLLER...');
  setupInput();
  setupMobile();
  lp(100,'KLAR!');

  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  setTimeout(function(){
    document.getElementById('loading').style.display='none';
    document.getElementById('hud').style.display='block';
    setMissionText('Välkommen till Stockholm \'95\nHitta ett uppdrag — leta efter gula markörer');
    loop();
  },400);
}

function lp(p,t){
  document.getElementById('lfill').style.width=p+'%';
  document.getElementById('loading-sub').textContent=t;
}

// ═══════════════════════════════════════════════════════════════
//  WORLD
// ═══════════════════════════════════════════════════════════════
function buildWorld(){
  // Ground
  var g=new THREE.PlaneGeometry(900,900,60,60);g.rotateX(-Math.PI/2);
  var gm=new THREE.MeshLambertMaterial({color:0x111116});
  var ground=new THREE.Mesh(g,gm);ground.receiveShadow=true;scene.add(ground);

  // Water
  addFlat(300,120,-80,0.08,80,-0.15,0x071828,0.92,'water');
  addFlat(180,80,120,0.08,40,-0.15,0x071828,0.92,'water');
  addFlat(120,60,-100,0.08,130,-0.15,0x071828,0.92,'water');

  // Districts
  buildDistrict(  0,   0, 75,  0x181c20, 6, 22, 'slussen');
  buildDistrict(-30,  65,100,  0x161a16, 5, 18, 'sodermalm');
  buildDistrict(-120,-20, 65,  0x1a1a1c, 4, 16, 'fridhemsplan');
  buildDistrict( 20,-120, 65,  0x1c2022, 6, 24, 'odenplan');
  buildDistrict( 40, -40, 58,  0x181c22, 8, 28, 'tcentralen');
  buildDistrict(-80, -25, 75,  0x1a1c1a, 5, 18, 'kungsholmen');
  buildDistrict( 10, -85, 65,  0x1c1c1e, 5, 20, 'vasastan');
  buildDistrict( 60, 120, 55,  0x14161a, 4, 14, 'dockorna');

  // Roads
  buildAllRoads();
  // Bridges
  buildBridge(-10,38,80,false,'Västerbron');
  buildBridge(62,25,60,false,'Centralbron');
  buildBridge(12,8,22,true,'Riksbron');
  buildBridge(-90,40,30,false,'Liljeholmsbron');
  // Lights
  addAllStreetlights();
  // Landmarks
  buildLandmarks();
  // Graffiti / territory markers
  addTerritoryMarkers();
}

function addFlat(w,d,x,h,z,y,color,opacity,tag){
  var geo=new THREE.PlaneGeometry(w,d);geo.rotateX(-Math.PI/2);
  var mat=new THREE.MeshLambertMaterial({color:color,transparent:opacity<1,opacity:opacity});
  var m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.receiveShadow=true;
  scene.add(m);
}

var rnd;
function buildDistrict(cx,cz,radius,baseCol,minH,maxH,tag){
  rnd=seededRand(cx*7+cz*13+radius);
  var blockCount=Math.floor(radius/13);
  for(var bx=-blockCount;bx<=blockCount;bx++){
    for(var bz=-blockCount;bz<=blockCount;bz++){
      var wx=cx+bx*14+(rnd()-.5)*3;
      var wz=cz+bz*14+(rnd()-.5)*3;
      if(Math.sqrt((wx-cx)*(wx-cx)+(wz-cz)*(wz-cz))>radius) continue;
      var w=5+rnd()*6, d=5+rnd()*6, h=minH+rnd()*(maxH-minH);
      var shade=Math.floor(rnd()*0x101010);
      addBuilding(wx,wz,w,h,d,baseCol+shade);
    }
  }
}

function addBuilding(x,z,w,h,d,color){
  var geo=new THREE.BoxGeometry(w,h,d);
  var mat=new THREE.MeshLambertMaterial({color:color});
  var mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(x,h/2,z);
  mesh.castShadow=true;mesh.receiveShadow=true;
  scene.add(mesh);
  // Windows
  var floors=Math.floor(h/3.2);
  var winMat=new THREE.MeshBasicMaterial({color:Math.random()<.35?0xffeeaa:0x223344,transparent:true,opacity:.85});
  for(var f=1;f<floors;f++){
    var wy=f*3.2-h/2+1.2;
    [[0,0,-d/2-.04,0],[0,0,d/2+.04,Math.PI],[−w/2-.04,0,0,Math.PI/2],[w/2+.04,0,0,-Math.PI/2]].forEach(function(s){
      if(Math.random()<.45) return;
      var wg=new THREE.PlaneGeometry(1.1,.9);
      var wm=new THREE.Mesh(wg,winMat.clone());
      wm.position.set(x+s[0],wy,z+s[2]);
      wm.rotation.y=s[3];
      scene.add(wm);
    });
  }
  colBoxes.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,h:h,type:'building'});
}

var subwayTrains=[];
function buildSubway(){
  var platMat=new THREE.MeshLambertMaterial({color:0x1a1a28});
  var stations=[
    {n:'T-CENTRALEN',    x:40, z:-40, line:'all'},
    {n:'KUNGSTRÄDGÅRDEN',x:72, z:-40, line:'blue'},
    {n:'RÅDHUSET',       x:8,  z:-40, line:'blue'},
    {n:'FRIDHEMSPLAN',   x:-40,z:-40, line:'blue'},
    {n:'STADSHAGEN',     x:-82,z:-40, line:'blue'},
    {n:'HÖTORGET',       x:40, z:-62, line:'green'},
    {n:'RÅDMANSGATAN',   x:40, z:-82, line:'green'},
    {n:'ODENPLAN',       x:22, z:-120,line:'green'},
    {n:"S:T ERIKSPLAN",  x:-18,z:-82, line:'green'},
    {n:'SLUSSEN',        x:0,  z:2,   line:'red'},
    {n:'MARIATORGET',    x:-18,z:20,  line:'red'},
    {n:'ZINKENSDAMM',    x:-30,z:42,  line:'red'},
    {n:'HORNSTULL',      x:-50,z:62,  line:'red'},
    {n:'MEDBORGARPLATSEN',x:18,z:32,  line:'red'},
    {n:'SKANSTULL',      x:22, z:62,  line:'red'},
  ];

  var lineColors={blue:0x2255cc,green:0x228833,red:0xcc2222,all:0xffffff};

  stations.forEach(function(st){
    // Platform
    var pg=new THREE.BoxGeometry(18,3.2,9);
    var pm=new THREE.Mesh(pg,platMat);pm.position.set(st.x,-4.5,st.z);scene.add(pm);
    // Tiles
    var tg=new THREE.BoxGeometry(17.5,.05,8.5);
    var tm=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({color:0x282836}));
    tm.position.set(st.x,-2.92,st.z);scene.add(tm);
    // Line color stripe
    var sg=new THREE.BoxGeometry(15,.1,.6);
    var sm=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:lineColors[st.line]}));
    sm.position.set(st.x,-2.85,st.z+4);scene.add(sm);
    // Entrance
    var eg=new THREE.BoxGeometry(4,2.5,4);
    var em=new THREE.Mesh(eg,new THREE.MeshLambertMaterial({color:0x1a2244}));
    em.position.set(st.x,.8,st.z);scene.add(em);
    // T-sign
    var tsg=new THREE.BoxGeometry(2.5,2.5,2.5);
    var tsm=new THREE.Mesh(tsg,new THREE.MeshBasicMaterial({color:0x003388}));
    tsm.position.set(st.x,3,st.z-2);scene.add(tsm);
    // Ambient light
    var pl=new THREE.PointLight(lineColors[st.line],1.4,22);
    pl.position.set(st.x,-2,st.z);scene.add(pl);
    // Graffiti on wall
    var ggg=new THREE.PlaneGeometry(3,1.2);
    var ggm=new THREE.Mesh(ggg,new THREE.MeshBasicMaterial({color:lineColors[st.line],transparent:true,opacity:.4}));
    ggm.position.set(st.x-5,-3,st.z-4);scene.add(ggm);
  });

  // Tunnel track lines
  var lines=[
    {col:0xcc2222,pts:[[40,-40],[0,2],[18,32],[-18,20],[-30,42],[-50,62],[22,62]]},
    {col:0x228833,pts:[[40,-62],[40,-82],[22,-120],[-18,-82],[-40,-40]]},
    {col:0x2255cc,pts:[[-82,-40],[-40,-40],[8,-40],[40,-40],[72,-40]]},
  ];
  lines.forEach(function(line){
    for(var i=0;i<line.pts.length-1;i++){
      var a=line.pts[i],b=line.pts[i+1];
      var dx=b[0]-a[0],dz=b[1]-a[1],len=Math.sqrt(dx*dx+dz*dz);
      var mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2;
      var tg=new THREE.BoxGeometry(len,.25,1.6);
      var tm=new THREE.Mesh(tg,new THREE.MeshBasicMaterial({color:line.col,transparent:true,opacity:.5}));
      tm.position.set(mx,-4.85,mz);tm.rotation.y=Math.atan2(dx,dz);scene.add(tm);
    }
  });

  // Subway trains (animated)
  var trainLines=[
    {col:0x2255cc,pts:[[−82,-40],[-40,-40],[40,-40],[72,-40]],speed:.3},
    {col:0xcc2222,pts:[[40,-40],[0,2],[-50,62]],speed:.25},
    {col:0x228833,pts:[[40,-62],[40,-82],[22,-120]],speed:.2},
  ];
  trainLines.forEach(function(tl,ti){
    var trainGroup=new THREE.Group();
    var tm=new THREE.MeshLambertMaterial({color:tl.col});
    // 3 carriages
    for(var c=0;c<3;c++){
      var cg=new THREE.BoxGeometry(3,3,8);
      var car=new THREE.Mesh(cg,tm);car.position.set(c*9,0,0);car.castShadow=true;
      // Windows
      var wm2=new THREE.MeshBasicMaterial({color:0x223355,transparent:true,opacity:.7});
      for(var w2=0;w2<4;w2++){
        var wg2=new THREE.PlaneGeometry(1.2,.8);
        var wm3=new THREE.Mesh(wg2,wm2);
        wm3.position.set(c*9-1.2+w2*0.8,-0.2+w2%2*.5,4.1);scene.add(wm3);
        wm3.parent=trainGroup;
      }
      trainGroup.add(car);
    }
    trainGroup.position.set(tl.pts[0][0],-4.5,tl.pts[0][1]);
    scene.add(trainGroup);
    trainGroup.userData={pts:tl.pts,t:ti*.3,speed:tl.speed,totalLen:0};
    // compute arc lengths
    var tot=0;
    for(var i=0;i<tl.pts.length-1;i++){
      var dx2=tl.pts[i+1][0]-tl.pts[i][0];
      var dz2=tl.pts[i+1][1]-tl.pts[i][1];
      tot+=Math.sqrt(dx2*dx2+dz2*dz2);
    }
    trainGroup.userData.totalLen=tot;
    subwayTrains.push(trainGroup);
  });
}

    g.userData.sirenLight=new THREE.PointLight(0x0044ff,0,18);
    g.userData.sirenLight.position.set(0,2.5,0);g.add(g.userData.sirenLight);
  }
  if(type==='taxi'){
    var taxi=new THREE.Mesh(new THREE.BoxGeometry(1,.3,.8),new THREE.MeshBasicMaterial({color:0xddcc00}));
    taxi.position.set(0,2.02,0);g.add(taxi);
  }

  g.position.set(x,.22,z);
  g.userData.type=type;g.userData.color=color;
  g.userData.speed=0;g.userData.maxSpeed=type==='police'?24:17;
  g.userData.steer=0;g.userData.occupied=false;g.userData.hp=200;
  g.userData.driver=null;g.userData.sirenOn=false;
  colBoxes.push({minX:x-1.1,maxX:x+1.1,minZ:z-2.3,maxZ:z+2.3,h:2,type:'vehicle',ref:g});
  scene.add(g);vehicles.push(g);
  return g;
}

function setupInput(){
  document.addEventListener('keydown',function(e){
    keys[e.code]=true;
    if(e.code==='KeyV') toggleCamera();
    if(e.code==='KeyF') tryEnterVehicle();
    if(e.code==='KeyE') interact();
    if(e.code==='KeyQ') cycleWeapon(-1);
    if(e.code==='KeyR') cycleWeapon(1);
    if(e.code==='Escape') closeShop();
    if(e.code==='Tab'){e.preventDefault();openWeaponWheel();}
  });
  document.addEventListener('keyup',function(e){keys[e.code]=false;});
  document.addEventListener('mousedown',function(e){
    if(e.button===0) shooting=true;
    if(e.button===2) tryEnterVehicle();
  });
  document.addEventListener('mouseup',function(e){if(e.button===0) shooting=false;});
  document.addEventListener('mousemove',function(e){
    if(!mouseLocked) return;
    camH-=e.movementX*.003;
    camV=Math.max(-.4,Math.min(.85,camV+e.movementY*.003));
  });
  document.addEventListener('wheel',function(e){
    camDist=Math.max(2,Math.min(22,camDist+e.deltaY*.01));
  });
  document.addEventListener('pointerlockchange',function(){
    mouseLocked=document.pointerLockElement===renderer.domElement;
  });
  renderer.domElement.addEventListener('click',function(){
    if(!mouseLocked) renderer.domElement.requestPointerLock&&renderer.domElement.requestPointerLock();
  });
}

function setupMobile(){
  if(!('ontouchstart' in window)) return;
  document.getElementById('mobile').style.display='block';
  document.getElementById('crosshair').style.display='block';
  setupJoy('jL','jLk',jL);
  setupJoy('jR','jRk',jR);
  document.getElementById('bShoot').addEventListener('touchstart',function(e){e.preventDefault();shooting=true;},{passive:false});
  document.getElementById('bShoot').addEventListener('touchend',function(){shooting=false;});
  document.getElementById('bSprint').addEventListener('touchstart',function(e){e.preventDefault();sprinting=true;},{passive:false});
  document.getElementById('bSprint').addEventListener('touchend',function(){sprinting=false;});
  document.getElementById('bEnter').addEventListener('touchstart',function(e){e.preventDefault();tryEnterVehicle();},{passive:false});
  document.getElementById('bCam').addEventListener('touchstart',function(e){e.preventDefault();toggleCamera();},{passive:false});
  document.getElementById('bWeapon').addEventListener('touchstart',function(e){e.preventDefault();cycleWeapon(1);},{passive:false});
}

function setupJoy(baseId,knobId,out){
  var base=document.getElementById(baseId);
  var knob=document.getElementById(knobId);
  var active=false,sx=0,sy=0,mr=32;
  base.addEventListener('touchstart',function(e){e.preventDefault();active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
  base.addEventListener('touchmove',function(e){
    e.preventDefault();if(!active)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    var dist=Math.min(Math.sqrt(dx*dx+dy*dy),mr),ang=Math.atan2(dy,dx);
    knob.style.transform='translate('+(dist*Math.cos(ang))+'px,'+(dist*Math.sin(ang))+'px)';
    out.x=dx/mr;out.y=dy/mr;
    var mg=Math.sqrt(out.x*out.x+out.y*out.y);
    if(mg>1){out.x/=mg;out.y/=mg;}
  },{passive:false});
  base.addEventListener('touchend',function(){active=false;out.x=0;out.y=0;knob.style.transform='';});
}

function update(dt){
  if(P.dead){updateDeath(dt);return;}
  updatePlayer(dt);
  if(P.inVehicle) updateDriving(dt);
  updateNPCs(dt);
  updateBullets(dt);
  updateExplosions(dt);
  updatePickups(dt);
  updateMissionMarkers(dt);
  updateSubwayTrains(dt);
  updateWanted(dt);
  updateCamera();
  updateHUD();
  updateArea();
  updateRadio(dt);
  checkShooting(dt);
  dynamicFactionEvents(dt);
}

// ── Player movement ───────────────────────────────────────────
var pVel={x:0,z:0};
function updatePlayer(dt){
  if(P.inVehicle) return;
  var spd=(sprinting||keys['ShiftLeft'])?6.5:3.8;
  var mx=0,mz=0;

  // Keyboard
  if(keys['KeyW']||keys['ArrowUp'])   {mx+=Math.sin(camH);mz+=Math.cos(camH);}
  if(keys['KeyS']||keys['ArrowDown']) {mx-=Math.sin(camH);mz-=Math.cos(camH);}
  if(keys['KeyA']||keys['ArrowLeft']) {mx+=Math.cos(camH);mz-=Math.sin(camH);}
  if(keys['KeyD']||keys['ArrowRight']){mx-=Math.cos(camH);mz+=Math.sin(camH);}

  // Joystick override
  if(Math.abs(jL.x)>.08||Math.abs(jL.y)>.08){
    mx=jL.x*Math.cos(camH)+(-jL.y)*Math.sin(camH);
    mz=(-jL.y)*Math.cos(camH)-jL.x*Math.sin(camH);
    spd*=Math.min(1,Math.sqrt(jL.x*jL.x+jL.y*jL.y));
  }

  var len=Math.sqrt(mx*mx+mz*mz);
  if(len>.01){
    mx/=len;mz/=len;
    pVel.x=mx*spd;pVel.z=mz*spd;
    P.mesh.rotation.y=Math.atan2(mx,mz);
    P.bobT+=dt*spd*3.5;
    if(P.mesh.userData.body) P.mesh.userData.body.position.y=.55+Math.abs(Math.sin(P.bobT))*.09;
  } else {
    pVel.x*=.82;pVel.z*=.82;P.bobT=0;
  }

  var nx=P.mesh.position.x+pVel.x*dt;
  var nz=P.mesh.position.z+pVel.z*dt;
  if(!colTest(nx,nz,.45)){P.mesh.position.x=nx;P.mesh.position.z=nz;}
  else if(!colTest(nx,P.mesh.position.z,.45)){P.mesh.position.x=nx;}
  else if(!colTest(P.mesh.position.x,nz,.45)){P.mesh.position.z=nz;}

  P.mesh.position.x=Math.max(-400,Math.min(400,P.mesh.position.x));
  P.mesh.position.z=Math.max(-400,Math.min(400,P.mesh.position.z));

  // Check entering water (drown)
  var px=P.mesh.position.x,pz=P.mesh.position.z;
  if((px>-230&&px<70&&pz>30&&pz<130)|| // water1
     (px>30&&px<210&&pz>0&&pz<80)){     // water2
    P.hp-=dt*20;
    setMissionText('DRUNKNAR!');
    if(P.hp<=0) killPlayer();
  }
}

function colTest(x,z,r){
  for(var i=0;i<colBoxes.length;i++){
    var c=colBoxes[i];
    if(c.type==='vehicle'&&c.ref===P.inVehicle) continue;
    if(x+r>c.minX&&x-r<c.maxX&&z+r>c.minZ&&z-r<c.maxZ) return true;
  }
  return false;
}

// ── Vehicle driving ───────────────────────────────────────────
var sirenTimer=0;
function updateDriving(dt){
  var v=P.inVehicle;
  var accel=keys['KeyW']||keys['ArrowUp']||jL.y<-.15;
  var brake=keys['KeyS']||keys['ArrowDown']||jL.y>.15;
  var left= keys['KeyA']||keys['ArrowLeft']||jL.x<-.15;
  var right=keys['KeyD']||keys['ArrowRight']||jL.x>.15;

  if(accel) v.userData.speed=Math.min(v.userData.speed+8*dt,v.userData.maxSpeed);
  else if(brake){
    if(v.userData.speed>0) v.userData.speed=Math.max(0,v.userData.speed-12*dt);
    else v.userData.speed=Math.max(-v.userData.maxSpeed*.4,v.userData.speed-6*dt);
  } else {
    v.userData.speed*=.96;
  }
  if(keys['ShiftLeft']||sprinting) v.userData.speed*=.92; // handbrake

  var steerForce=.04*(1-Math.abs(v.userData.speed)/v.userData.maxSpeed*.5);
  if(left)  v.rotation.y+=steerForce*v.userData.speed*.5;
  if(right) v.rotation.y-=steerForce*v.userData.speed*.5;

  var vx=Math.sin(v.rotation.y)*v.userData.speed;
  var vz=Math.cos(v.rotation.y)*v.userData.speed;
  var nx=v.position.x+vx*dt;
  var nz=v.position.z+vz*dt;

  if(!colTestVehicle(nx,nz,v)){
    v.position.x=nx;v.position.z=nz;
  } else {
    // Crash
    if(Math.abs(v.userData.speed)>5){
      v.userData.hp-=Math.abs(v.userData.speed)*2;
      P.hp-=Math.abs(v.userData.speed)*.5;
    }
    v.userData.speed*=-.3;
  }
  v.position.x=Math.max(-380,Math.min(380,v.position.x));
  v.position.z=Math.max(-380,Math.min(380,v.position.z));

  P.mesh.position.copy(v.position);
  P.mesh.position.y=v.position.y;

  // Update colBox
  for(var i=0;i<colBoxes.length;i++){
    if(colBoxes[i].ref===v){
      colBoxes[i].minX=v.position.x-1.1;colBoxes[i].maxX=v.position.x+1.1;
      colBoxes[i].minZ=v.position.z-2.3;colBoxes[i].maxZ=v.position.z+2.3;
    }
  }
  // Wheel spin
  v.children.forEach(function(c){
    if(c.geometry instanceof THREE.CylinderGeometry) c.rotation.x+=v.userData.speed*dt*.5;
  });

  // Police siren
  if(v.userData.type==='police'&&P.wanted>1){
    v.userData.sirenOn=true;
    sirenTimer+=dt*4;
    if(v.userData.sirenLight){
      v.userData.sirenLight.intensity=1.5;
      v.userData.sirenLight.color.setHex(Math.sin(sirenTimer)>0?0xff0000:0x0000ff);
    }
  }

  document.getElementById('speed-box').style.display='block';
  document.getElementById('speed-box').textContent=Math.round(Math.abs(v.userData.speed)*3.6)+' KM/H';
}

function colTestVehicle(x,z,veh){
  for(var i=0;i<colBoxes.length;i++){
    var c=colBoxes[i];
    if(c.ref===veh) continue;
    if(c.type==='water') continue;
    if(x+1.2>c.minX&&x-1.2<c.maxX&&z+2.4>c.minZ&&z-2.4<c.maxZ) return true;
  }
  return false;
}

// ── NPC AI ────────────────────────────────────────────────────
var dynEventTimer=0;
function updateNPCs(dt){
  var px=P.mesh.position.x, pz=P.mesh.position.z;
  npcs.forEach(function(n){
    var ud=n.userData;
    if(ud.dead){
      ud.deathTimer-=dt;
      if(ud.deathTimer<=0){scene.remove(n);npcs.splice(npcs.indexOf(n),1);}
      return;
    }
    var dx=px-n.position.x,dz=pz-n.position.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>160){n.visible=false;return;}
    n.visible=true;

    // Patrol
    if(ud.state==='patrol'){
      var tx=ud.patrolPt.x-n.position.x;
      var tz=ud.patrolPt.z-n.position.z;
      var td=Math.sqrt(tx*tx+tz*tz);
      if(td<2){
        ud.patrolPt.set(n.position.x+(Math.random()-.5)*35,0,n.position.z+(Math.random()-.5)*35);
      } else {
        n.position.x+=tx/td*ud.speed*dt;
        n.position.z+=tz/td*ud.speed*dt;
        n.rotation.y=Math.atan2(tx,tz);
      }
    }

    // Alert based on wanted / player actions
    if(ud.type==='police'&&P.wanted>0&&dist<50) ud.alertLevel=Math.min(100,ud.alertLevel+dt*30);
    if(ud.type==='gang'&&dist<20&&P.wanted>0)   ud.alertLevel=Math.min(100,ud.alertLevel+dt*15);
    if(ud.alertLevel>50) ud.state='chase';
    if(ud.alertLevel>80) ud.state='attack';
    if(ud.alertLevel>0)  ud.alertLevel=Math.max(0,ud.alertLevel-dt*3);

    // Chase
    if(ud.state==='chase'&&dist>2){
      n.position.x+=dx/dist*ud.speed*1.6*dt;
      n.position.z+=dz/dist*ud.speed*1.6*dt;
      n.rotation.y=Math.atan2(dx,dz);
    }

    // Attack / shoot
    if(ud.state==='attack'){
      n.position.x+=dx/dist*ud.speed*.8*dt;
      n.position.z+=dz/dist*ud.speed*.8*dt;
      n.rotation.y=Math.atan2(dx,dz);
      ud.shootTimer-=dt;
      if(ud.shootTimer<=0&&dist<(ud.weapon?ud.weapon.range:5)){
        ud.shootTimer=.6+Math.random()*.8;
        if(dist<3&&!ud.weapon.range) { // melee
          P.hp-=ud.weapon.dmg*(1-P.armor*.006);
          showDamage();
        } else if(dist<ud.weapon.range){
          npcShoot(n,dx/dist,dz/dist,ud.weapon);
        }
        if(P.hp<=0) killPlayer();
      }
    }

    // Civil flee
    if(ud.type==='civil'&&dist<12&&P.wanted>1){
      var fleeDist=dist||1;
      n.position.x-=dx/fleeDist*2.5*dt;
      n.position.z-=dz/fleeDist*2.5*dt;
    }

    // Faction vs faction
    npcs.forEach(function(other){
      if(other===n||other.userData.dead) return;
      var isEnemy=isEnemyFaction(ud.faction,other.userData.faction);
      if(!isEnemy) return;
      var edx=other.position.x-n.position.x,edz=other.position.z-n.position.z;
      var ed=Math.sqrt(edx*edx+edz*edz);
      if(ed<20&&ed>.5){
        ud.state='attack';
        ud.shootTimer-=dt;
        if(ud.shootTimer<=0&&ed<(ud.weapon?ud.weapon.range:4)){
          ud.shootTimer=.7+Math.random()*.7;
          var hit=Math.random()<.4;
          if(hit){
            other.userData.hp-=ud.weapon?ud.weapon.dmg:20;
            if(other.userData.hp<=0) killNPC(other);
          }
        }
        n.position.x+=edx/ed*ud.speed*.6*dt;
        n.position.z+=edz/ed*ud.speed*.6*dt;
        n.rotation.y=Math.atan2(edx,edz);
      }
    });
  });
}

function isEnemyFaction(a,b){
  if(a===b||a==='civil'||b==='civil') return false;
  var enemies={biker:['balkan','russian'],balkan:['biker','white','russian'],
               russian:['biker','balkan'],white:['balkan','biker'],police:['biker','balkan','russian','white']};
  return enemies[a]&&enemies[a].indexOf(b)>=0;
}

function killNPC(n){
  n.userData.dead=true;n.userData.deathTimer=8;
  n.rotation.z=Math.PI/2;n.position.y=-.3;
  spawnBlood(n.position.x,n.position.z);
  if(P.missionActive){
    missionKills++;
    checkMissionProgress();
  }
  if(Math.random()<.3) spawnWeaponPickup(n.position.x,n.position.z);
}

function npcShoot(n,dx,dz,weapon){
  // Inaccuracy
  dx+=( Math.random()-.5)*.3;
  dz+=(Math.random()-.5)*.3;
  var len=Math.sqrt(dx*dx+dz*dz);
  fireBullet(n.position.x,n.position.y+1.1,n.position.z,dx/len,dz/len,weapon,false);
}

// ── Shooting ──────────────────────────────────────────────────
var shootTimer=0;
function checkShooting(dt){
  if(!shooting||P.inVehicle) return;
  var w=P.weapons[P.weapon];
  shootTimer-=dt;
  if(shootTimer>0) return;
  shootTimer=w.auto?.1:.4;

  if(w.ammo===0){setMissionText('TOMT MAGASIN!');return;}
  if(w.ammo>0) w.ammo--;

  // Direction
  var dirX=Math.sin(camH),dirZ=Math.cos(camH);
  // Small spread
  dirX+=(Math.random()-.5)*.04;
  dirZ+=(Math.random()-.5)*.04;
  var len=Math.sqrt(dirX*dirX+dirZ*dirZ);

  // Muzzle flash
  spawnMuzzleFlash(P.mesh.position.x,P.mesh.position.z);

  if(w.range<=3){
    // Melee
    hitNear(P.mesh.position.x,P.mesh.position.z,w.range,w.dmg);
    addWanted(.05);
  } else {
    fireBullet(P.mesh.position.x,P.mesh.position.y+1.2,P.mesh.position.z,dirX/len,dirZ/len,w,true);
    addWanted(.02);
  }
  updateWeaponHUD();
}

function fireBullet(x,y,z,dx,dz,weapon,fromPlayer){
  var geo=new THREE.SphereGeometry(.08,4,4);
  var mat=new THREE.MeshBasicMaterial({color:fromPlayer?0xffff44:0xff4422});
  var b=new THREE.Mesh(geo,mat);
  b.position.set(x,y,z);
  scene.add(b);
  bullets.push({mesh:b,dx:dx,dz:dz,speed:weapon.range*4,
    dmg:weapon.dmg,dist:0,maxDist:weapon.range,fromPlayer:fromPlayer,
    weapon:weapon});
}

function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    var moveX=b.dx*b.speed*dt;
    var moveZ=b.dz*b.speed*dt;
    b.mesh.position.x+=moveX;
    b.mesh.position.z+=moveZ;
    b.dist+=Math.sqrt(moveX*moveX+moveZ*moveZ);

    var hit=false;
    if(b.fromPlayer){
      // Check NPC hits
      for(var j=0;j<npcs.length;j++){
        var n=npcs[j];if(n.userData.dead)continue;
        var ndx=n.position.x-b.mesh.position.x;
        var ndz=n.position.z-b.mesh.position.z;
        if(Math.sqrt(ndx*ndx+ndz*ndz)<.8){
          n.userData.hp-=b.dmg;
          spawnBlood(n.position.x,n.position.z);
          if(n.userData.hp<=0) killNPC(n);
          else{ n.userData.state='attack';n.userData.alertLevel=100; }
          addWanted(.1);hit=true;break;
        }
      }
    } else {
      // Check player hit
      var pdx=P.mesh.position.x-b.mesh.position.x;
      var pdz=P.mesh.position.z-b.mesh.position.z;
      if(Math.sqrt(pdx*pdx+pdz*pdz)<.7){
        P.hp-=b.dmg*(1-P.armor*.007);
        showDamage();hit=true;
        if(P.hp<=0) killPlayer();
      }
    }

    // Explosion weapons
    if(b.weapon.range<=8&&b.dist>b.maxDist*.5&&!hit){
      spawnExplosion(b.mesh.position.x,b.mesh.position.z,b.weapon.dmg);
      hit=true;
    }

    // Building hit or max dist
    if(b.dist>b.maxDist||colTest(b.mesh.position.x,b.mesh.position.z,.2)) hit=true;

    if(hit){ scene.remove(b.mesh);bullets.splice(i,1); }
  }
}

function spawnExplosion(x,z,dmg){
  var geo=new THREE.SphereGeometry(1,8,6);
  var mat=new THREE.MeshBasicMaterial({color:0xff6600});
  var m=new THREE.Mesh(geo,mat);m.position.set(x,1,z);
  scene.add(m);
  var pl=new THREE.PointLight(0xff6600,6,20);pl.position.set(x,2,z);scene.add(pl);
  explosions.push({mesh:m,light:pl,timer:1.5,maxTimer:1.5,x:x,z:z,dmg:dmg});
  // Damage nearby
  npcs.forEach(function(n){
    if(n.userData.dead)return;
    var d=Math.sqrt((n.position.x-x)*(n.position.x-x)+(n.position.z-z)*(n.position.z-z));
    if(d<8){n.userData.hp-=dmg*(1-d/8);if(n.userData.hp<=0)killNPC(n);}
  });
  var pd=Math.sqrt((P.mesh.position.x-x)*(P.mesh.position.x-x)+(P.mesh.position.z-z)*(P.mesh.position.z-z));
  if(pd<8){P.hp-=dmg*(1-pd/8)*(1-P.armor*.006);showDamage();}
}

function updateExplosions(dt){
  for(var i=explosions.length-1;i>=0;i--){
    var e=explosions[i];e.timer-=dt;
    var progress=1-e.timer/e.maxTimer;
    e.mesh.scale.setScalar(1+progress*4);
    e.mesh.material.opacity=e.timer/e.maxTimer;
    e.mesh.material.transparent=true;
    e.light.intensity=6*(1-progress);
    if(e.timer<=0){
      scene.remove(e.mesh);scene.remove(e.light);explosions.splice(i,1);
    }
  }
}

  scene.remove(marker);missionMarkers.splice(missionMarkers.indexOf(marker),1);

function checkMissionProgress(){
  if(!P.missionActive) return;
  var ms=P.missionActive;
  if(ms.type==='kill'&&missionKills>=1) completeMission();
  if(ms.type==='war'&&missionKills>=8) completeMission();
  if(ms.type==='protect'&&missionKills>=5) completeMission();
  // deliver / vehicle / survive check in updatePlayer proximity
  var px=P.mesh.position.x,pz=P.mesh.position.z;
  var tx=ms.target.x-px,tz=ms.target.z-pz;
  if(Math.sqrt(tx*tx+tz*tz)<5){
    if(ms.type==='deliver'||ms.type==='vehicle') completeMission();
    if(ms.type==='survive'&&missionKills>=3) completeMission();
  }
}

function completeMission(){

  P.money+=ms.reward;P.missionActive=null;missionKills=0;
  document.getElementById('objective').textContent='';
  setMissionText('UPPDRAG KLART!\n$ +'+ms.reward);
  showDialogue(ms.giver,'Bra jobbat. Pengarna är dina.');

  if(ms.reward>=2000) giveWeapon(7);
  else if(ms.reward>=1000) giveWeapon(5);
  addWanted(-.5);
  P.score+=ms.reward;
}

function updateSubwayTrains(dt){
  subwayTrains.forEach(function(train){
    var ud=train.userData;ud.t+=dt*ud.speed;
    var d=ud.t*ud.totalLen%ud.totalLen,acc=0;
    for(var i=0;i<ud.pts.length-1;i++){
      var a=ud.pts[i],b=ud.pts[i+1];
      var seg=Math.sqrt((b[0]-a[0])*(b[0]-a[0])+(b[1]-a[1])*(b[1]-a[1]));
      if(acc+seg>=d){
        var frac=(d-acc)/seg;
        train.position.x=a[0]+(b[0]-a[0])*frac;
        train.position.z=a[1]+(b[1]-a[1])*frac;
        train.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);
        break;
      }
      acc+=seg;
    }
  });
}

function updateMinimap(){
  var ms=140,sc=ms/280;
  var px=P.inVehicle?P.inVehicle.position.x:P.mesh.position.x;
  var pz=P.inVehicle?P.inVehicle.position.z:P.mesh.position.z;
  mmCtx.fillStyle='#06080e';mmCtx.fillRect(0,0,ms,ms);
  var cx=ms/2,cy=ms/2;
  function wx(x){return cx+(x-px)*sc;}function wy(z){return cy+(z-pz)*sc;}
  [{x:-120,z:-20,r:50,c:'rgba(255,100,0,.14)'},{x:0,z:0,r:60,c:'rgba(200,0,0,.11)'},
   {x:40,z:-40,r:45,c:'rgba(220,170,0,.11)'},{x:20,z:-120,r:50,c:'rgba(100,100,200,.11)'}].forEach(function(t){
    mmCtx.fillStyle=t.c;mmCtx.beginPath();mmCtx.arc(wx(t.x),wy(t.z),t.r*sc,0,Math.PI*2);mmCtx.fill();});
  mmCtx.strokeStyle='#22222e';mmCtx.lineWidth=4;
  [[0,-200,0,200],[-200,0,200,0],[-200,-40,200,-40],[-200,-80,200,-80],
   [-200,-120,200,-120],[-200,60,200,60],[40,-200,40,200],[-40,-200,-40,200]].forEach(function(r){
    mmCtx.beginPath();mmCtx.moveTo(wx(r[0]),wy(r[1]));mmCtx.lineTo(wx(r[2]),wy(r[3]));mmCtx.stroke();});
  [{c:'#cc2222',pts:[[40,-40],[0,2],[-50,62],[22,62]]},
   {c:'#228833',pts:[[40,-62],[40,-82],[22,-120],[-40,-40]]},
   {c:'#2255cc',pts:[[-82,-40],[40,-40],[72,-40]]}].forEach(function(l){
    mmCtx.strokeStyle=l.c;mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.moveTo(wx(l.pts[0][0]),wy(l.pts[0][1]));
    for(var i=1;i<l.pts.length;i++)mmCtx.lineTo(wx(l.pts[i][0]),wy(l.pts[i][1]));mmCtx.stroke();});
  npcs.forEach(function(n){if(!n.visible||n.userData.dead)return;var f=FACTIONS[n.userData.faction];
    mmCtx.fillStyle=f?('#'+f.acc.toString(16).padStart(6,'0')):'#aaa';mmCtx.fillRect(wx(n.position.x)-1.5,wy(n.position.z)-1.5,3,3);});
  mmCtx.fillStyle='#ffffff44';vehicles.forEach(function(v){mmCtx.fillRect(wx(v.position.x)-2.5,wy(v.position.z)-1.5,5,3);});
  missionMarkers.forEach(function(m){mmCtx.fillStyle=m.userData.missionTarget?'#ff2222':'#ffdd00';mmCtx.fillRect(wx(m.position.x)-3,wy(m.position.z)-3,6,6);});
  if(P.wanted>1){mmCtx.strokeStyle='#ff2222';mmCtx.lineWidth=2;mmCtx.strokeRect(cx-ms/2+2,cy-ms/2+2,ms-4,ms-4);}
  mmCtx.fillStyle='#ffdd44';mmCtx.beginPath();mmCtx.arc(cx,cy,5,0,Math.PI*2);mmCtx.fill();
  var pr=P.inVehicle?P.inVehicle.rotation.y:P.mesh.rotation.y;
  mmCtx.strokeStyle='#ffdd44';mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.moveTo(cx,cy);mmCtx.lineTo(cx+Math.sin(pr)*9,cy+Math.cos(pr)*9);mmCtx.stroke();
  mmCtx.strokeStyle='#ffffff18';mmCtx.lineWidth=1;mmCtx.strokeRect(0,0,ms,ms);
  mmCtx.fillStyle='#ff6a0077';mmCtx.font='8px Courier New';mmCtx.fillText('N',ms/2-3,9);
}

  var fArr=['civil','civil','civil','biker','balkan','russian','white','police'];
  var f=fArr[Math.floor(Math.random()*fArr.length)];
  var t=f==='police'?'police':f==='civil'?'civil':'gang';
  makeNPC(px+Math.cos(ang)*dist,pz+Math.sin(ang)*dist,f,t);
}
function pruneFar(){
  var px=P.mesh.position.x,pz=P.mesh.position.z;
  for(var i=npcs.length-1;i>=0;i--){
    var n=npcs[i];var d=Math.sqrt((n.position.x-px)*(n.position.x-px)+(n.position.z-pz)*(n.position.z-pz));
    if(d>180&&!n.userData.dead){scene.remove(n);npcs.splice(i,1);}
  }
}
function seededRand(seed){var s=seed;return function(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};}

function loop(){
  requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);frameN++;
  if(frameN%150===0) dynamicSpawn();
  if(frameN%400===0) pruneFar();
  if(frameN%600===0) spawnWeaponPickup((Math.random()-.5)*180,(Math.random()-.5)*180);
  if(frameN%200===0) checkMissionProgress();
  if(frameN%2===0){missionMarkers.forEach(function(m){m.rotation.y+=.02;if(m.children[0])m.children[0].rotation.y+=.02;});pickups.forEach(function(m){m.rotation.x+=.03;m.rotation.z+=.02;});}
  update(dt);updateMinimap();renderer.render(scene,camera);
}
function waitForThree(n){
  if(typeof THREE!=='undefined'){init();}
  else if(n>0){setTimeout(function(){waitForThree(n-1);},300);}
  else{document.getElementById('loading-sub').textContent='FEL: three.js laddades inte';}
}
window.addEventListener('load',function(){waitForThree(25);});
</script>
