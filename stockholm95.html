(function() {
  var srcs = [
    'three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',

    'https://unpkg.com/three@0.128.0/build/three.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= srcs.length) {
      document.getElementById('load-sub').textContent = 'FEL: Kan inte ladda Three.js';
      return;
    }
    var s = document.createElement('script');
    s.src = srcs[i++];
    s.onload = function() {
      window.threeReady = true;
    };
    s.onerror = function() { tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
})();

<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  STOCKHOLM '95 — Three.js GTA-style game
//  Requires three.min.js in same folder
// ═══════════════════════════════════════════════════════

if (typeof THREE === 'undefined') {
  document.getElementById('load-sub').textContent = 'FEL: three.min.js saknas!';
  document.getElementById('load-sub').style.color = '#ff4444';

// ── Engine ────────────────────────────────────────────
var scene, camera, renderer, clock;
var thirdPerson = true;
var camH = 0, camV = 0.4, camDist = 8;
var mouseLocked = false;
var frameN = 0;

// ── Input ─────────────────────────────────────────────
var keys = {};
var jL={x:0,y:0}, jR={x:0,y:0};
var firing=false, sprinting=false;

// ── Player ────────────────────────────────────────────
var P = {
  mesh:null, vel:{x:0,z:0}, bobT:0,
  hp:100, armor:0, money:500,
  wanted:0, wantedCD:0, wantedT:0,
  weapon:0, weapons:[], inVehicle:null,
  shootCD:0, dead:false,
  missionActive:null, missionKills:0, score:0
};

// ── Weapons ───────────────────────────────────────────
var WEAPONS = [
  {name:'KNYTNÄVAR', ammo:-1, max:-1, dmg:20, range:2.5, auto:false, price:0,    col:0xddaa88},
  {name:'JÄRNRÖR',   ammo:-1, max:-1, dmg:35, range:3.0, auto:false, price:0,    col:0x888888},
  {name:'KNIV',      ammo:-1, max:-1, dmg:45, range:2.2, auto:false, price:200,  col:0xcccccc},
  {name:'PISTOL',    ammo:24, max:80, dmg:30, range:40,  auto:false, price:500,  col:0x666666},
  {name:'REVOLVER',  ammo:6,  max:30, dmg:55, range:50,  auto:false, price:800,  col:0x888866},

  {name:'HAGELGEVÄR',ammo:6,  max:24, dmg:80, range:15,  auto:false, price:1500, col:0x553322},
  {name:'AK-47',     ammo:30, max:150,dmg:40, range:60,  auto:true,  price:3000, col:0x334422},
  {name:'GRANAT',    ammo:2,  max:6,  dmg:150,range:8,   auto:false, price:800,  col:0x556633},
  {name:'MOLOTOV',   ammo:3,  max:8,  dmg:80, range:7,   auto:false, price:400,  col:0xdd6600},
];

// ── Factions ──────────────────────────────────────────
var FACTIONS = {
  biker:  {col:0x222222, acc:0xff6600, base:{x:-120,z:-20}},
  balkan: {col:0x1a1a2e, acc:0xcc2222, base:{x:0,z:0}},

  white:  {col:0x334455, acc:0x8888cc, base:{x:20,z:-120}},
  police: {col:0x003388, acc:0xffffff, base:{x:0,z:0}},
  civil:  {col:0x445566, acc:0x99aacc, base:{x:0,z:0}},
};

var AREAS = [
  {name:'SLUSSEN',x:0,z:0,r:70},{name:'SÖDERMALM',x:-30,z:65,r:100},
  {name:'FRIDHEMSPLAN',x:-120,z:-20,r:65},{name:'ODENPLAN',x:20,z:-120,r:65},
  {name:'T-CENTRALEN',x:40,z:-40,r:55},{name:'KUNGSHOLMEN',x:-80,z:-25,r:75},
  {name:'VASASTAN',x:10,z:-85,r:65},{name:'DOCKORNA',x:60,z:120,r:60},
];

var MISSIONS = [
  {id:'m1',giver:'BALKAN BOSS',title:'LEVERANSEN',
   text:'Hämta paketet vid Slussen och leverera det till Hornstull. Snabbt.',
   obj:'Leverera paketet till Hornstull',
   start:{x:5,z:5},target:{x:-50,z:62},reward:800,type:'deliver',kills:0},
  {id:'m2',giver:'MC-CHEFEN',title:'ELIMINERA VITTNET',
   text:'En rysk agent vid T-Centralen vet för mycket. Ta hand om honom.',
   obj:'Eliminera agenten — döda 1 fiende',
   start:{x:-120,z:-20},target:{x:40,z:-40},reward:1500,type:'kill',kills:1},
  {id:'m3',giver:'BALKAN',title:'SKYDDA TRANSPORTEN',
   text:'Skydda vapentransporten till dockorna. Döda 5 fiender.',
   obj:'Döda 5 fiender',
   start:{x:40,z:-40},target:{x:60,z:120},reward:2000,type:'protect',kills:5},
  {id:'m4',giver:'MC-CHEFEN',title:'TERRITORIEKRIG',

   obj:'Döda 8 fiender',
   start:{x:-120,z:-20},target:{x:-30,z:65},reward:2500,type:'war',kills:8},
  {id:'m5',giver:'OKÄND',title:'DET STORA UPPGÖRET',
   text:'Alla gäng samlas vid T-Centralen. Överlev och döda 10.',
   obj:'Döda 10 fiender',
   start:{x:40,z:-40},target:{x:40,z:-40},reward:5000,type:'survive',kills:10},
];

var RADIO = [
  '📻 RADIO STOCKHOLM\n♪ ACE OF BASE — THE SIGN',
  '📻 RIX FM 95\n♪ ROXETTE — THE LOOK',
  '📻 P3\n♪ KENT — 747',
  '📻 NRJ\n♪ EUROPE — FINAL COUNTDOWN',
];

// ── Scene objects ─────────────────────────────────────
var colBoxes=[], npcs=[], vehicles=[], bullets=[], pickups=[];
var explosions=[], missionMarkers=[], shopMarkers=[];
var bloodDecals=[], subwayTrains=[];
var currentArea='SLUSSEN', radioIdx=0, radioT=0, dynT=0;

// ── Materials cache ────────────────────────────────────
var MAT={};
function lm(c){ return new THREE.MeshLambertMaterial({color:c}); }
function initMats(){
  MAT.ground = lm(0x0e0e14); MAT.water  = new THREE.MeshLambertMaterial({color:0x071828,transparent:true,opacity:.92});
  MAT.park   = lm(0x0f1f0f); MAT.road   = lm(0x141420); MAT.sidewalk = lm(0x1a1a26);
  MAT.bridge = lm(0x303038); MAT.bLow   = lm(0x2a3530); MAT.bMid = lm(0x3a5040);
  MAT.bHigh  = lm(0x5a7055); MAT.rMaj   = lm(0x383848); MAT.rMin = lm(0x252530);
  MAT.foot   = lm(0x1e2018); MAT.rail   = lm(0x1a2244); MAT.yellow= lm(0xddbb00);
  MAT.pole   = lm(0x444450); MAT.win_on = new THREE.MeshBasicMaterial({color:0xffffaa,transparent:true,opacity:.9});
  MAT.win_off= new THREE.MeshBasicMaterial({color:0x223344,transparent:true,opacity:.7});
}

// ── Init ──────────────────────────────────────────────
function lp(p,t){ document.getElementById('lfill').style.width=p+'%'; document.getElementById('load-sub').textContent=t; }

function init(){
  lp(5,'STARTAR...');
  clock = new THREE.Clock();
  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x060810);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x080c14, 0.011);
  scene.background = new THREE.Color(0x060810);
  camera = new THREE.PerspectiveCamera(68,innerWidth/innerHeight,0.1,600);

  scene.add(new THREE.AmbientLight(0x1a2233,1.0));
  var sun=new THREE.DirectionalLight(0x5577aa,0.8);
  sun.position.set(60,100,40); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=sun.shadow.camera.bottom=-220;
  sun.shadow.camera.right=sun.shadow.camera.top=220;
  sun.shadow.camera.near=1; sun.shadow.camera.far=500;
  scene.add(sun);
  scene.add(Object.assign(new THREE.DirectionalLight(0x221133,.3),{position:new THREE.Vector3(-30,20,-40)}));

  initMats();
  lp(12,'BYGGER STAD...');   buildWorld();
  lp(45,'TUNNELBANA...');    buildSubway();
  lp(58,'SPELARE...');       spawnPlayer();
  lp(68,'NPC...');           spawnNPCs();
  lp(78,'FORDON...');        spawnVehicles();
  lp(86,'PICKUPS...');       spawnPickups();
  lp(92,'UPPDRAG...');       spawnMarkers();
  lp(97,'KONTROLLER...');    setupInput(); setupMobile();
  P.weapons=[JSON.parse(JSON.stringify(WEAPONS[0]))];
  updateWepHUD();
  lp(100,'KLAR!');

  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  setTimeout(function(){
    document.getElementById('load').style.display='none';
    document.getElementById('hud').style.display='block';
    showMsg("Välkommen till Stockholm '95\nWASD=rörelse  Mus=sikta  Klick=skjut\nF=bil  E=interagera  Q/R=vapen  V=kamera");
    loop();
  },400);
}

// ── World builder ──────────────────────────────────────
function box3(w,h,d){ return new THREE.BoxGeometry(w,h,d); }
function mesh3(geo,mat,x,y,z,shadow){
  var m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  if(shadow){m.castShadow=true;m.receiveShadow=true;}
  else m.receiveShadow=true;
  scene.add(m); return m;
}
function seededRand(seed){ var s=seed; return function(){s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;}; }

function buildWorld(){
  // Ground
  var g=new THREE.PlaneGeometry(900,900); g.rotateX(-Math.PI/2);
  mesh3(g,MAT.ground,0,0,0,false);

  // Water
  addFlat(300,120,-80,-0.15,80,MAT.water);
  addFlat(200,80,120,-0.15,40,MAT.water);
  addFlat(120,60,-100,-0.15,130,MAT.water);

  // Parks
  [[−30,70,60,40],[18,-122,50,40],[−82,28,40,36],[32,80,30,24],
   [10,-88,30,24],[65,-85,25,20],[−50,50,22,18]].forEach(function(p){
    addFlat(p[2],p[3],p[0],0.01,p[1],MAT.park);
  });

  // Roads + sidewalks + markings
  var roads=[
    [0,0,420,9,true],[0,-40,420,9,true],[0,-80,420,8,true],[0,-120,420,9,true],
    [0,60,380,8,true],[0,120,300,7,true],
    [0,0,9,420,false],[−40,0,9,420,false],[40,0,9,420,false],
    [80,0,8,320,false],[−80,0,8,320,false],[−120,0,8,280,false],[120,0,7,280,false],
    [−20,30,5,80,false],[20,-20,5,60,false],[60,-60,5,80,false],
  ];
  roads.forEach(function(r){
    addFlat(r[2],r[3],r[0],0.02,r[1],MAT.road);
    // Sidewalks
    var off=(r[4]?r[3]:r[2])/2+1.8;
    [-1,1].forEach(function(s){
      addFlat(r[4]?r[2]:2.5, r[4]?2.5:r[3],
        r[4]?r[0]:r[0]+s*off, 0.01,
        r[4]?r[1]+s*off:r[1], MAT.sidewalk);
    });
    // Center line markings
    var steps=r[4]?Math.floor(r[2]/20):Math.floor(r[3]/20);
    for(var i=0;i<steps;i++){
      addFlat(r[4]?.15:4, r[4]?4:.15,
        r[4]?r[0]-r[2]/2+i*20+10:r[0], 0.03,
        r[4]?r[1]:r[1]-r[3]/2+i*20+10, MAT.yellow);
    }
  });

  // Districts
  buildDistrict(0,0,75,0x181c20,4,22);
  buildDistrict(-30,65,100,0x161a16,4,18);
  buildDistrict(-120,-20,65,0x1a1a1c,3,14);
  buildDistrict(20,-120,65,0x1c2022,5,22);
  buildDistrict(40,-40,58,0x181c22,6,26);
  buildDistrict(-80,-25,75,0x1a1c1a,4,16);
  buildDistrict(10,-85,65,0x1c1c1e,4,18);
  buildDistrict(60,120,55,0x14161a,3,12);

  // Landmarks
  addBuilding(-84,-27,22,38,18,0x9a8a78,'STADSHUSET','Stockholms Stadshus 1923.');
  addBuilding(-84,-27,4,55,4,0x9a8a78);
  var crown=new THREE.Mesh(new THREE.ConeGeometry(1.5,4,4),lm(0xddaa00));
  crown.position.set(-84,57.5,-27); scene.add(crown);
  addBuilding(40,-40,24,14,18,0x706858,'CENTRALSTATIONEN','Invigd 1871.');
  addBuilding(32,80,12,26,14,0x706050,'KATARINA KYRKA','Återinvigd 1995!');
  var spire=new THREE.Mesh(new THREE.ConeGeometry(2,16,8),lm(0x446644));

function buildDistrict(cx,cz,radius,baseCol,minH,maxH){
  var rnd=seededRand(cx*7+cz*13+radius);
  var bc=Math.floor(radius/13);
  for(var bx=-bc;bx<=bc;bx++){
    for(var bz=-bc;bz<=bc;bz++){
      var wx=cx+bx*14+(rnd()-.5)*3;
      var wz=cz+bz*14+(rnd()-.5)*3;
      if(Math.sqrt((wx-cx)*(wx-cx)+(wz-cz)*(wz-cz))>radius) continue;
      var w=5+rnd()*6, d=5+rnd()*6, h=minH+rnd()*(maxH-minH);
      var shade=Math.floor(rnd()*0x101010);
      addBuilding(wx,wz,w,h,d,baseCol+shade);
    }
  }
}

function addBuilding(x,z,w,h,d,col,name,desc){
  var mat=lm(col);
  var bm=new THREE.Mesh(box3(w,h,d),mat);
  bm.position.set(x,h/2,z); bm.castShadow=true; bm.receiveShadow=true;
  scene.add(bm);
  if(name) bm.userData={name:name,desc:desc||''};
  // Windows
  var floors=Math.floor(h/3.2);
  for(var f=1;f<floors;f++){
    var wy=f*3.2-h/2+1.2;
    [[0,0,-d/2-.04,0],[0,0,d/2+.04,Math.PI],[-w/2-.04,0,0,Math.PI/2],[w/2+.04,0,0,-Math.PI/2]].forEach(function(s){
      if(Math.random()<.45) return;
      var wg=new THREE.PlaneGeometry(1.1,.9);
      var wm=new THREE.Mesh(wg,Math.random()<.35?MAT.win_on.clone():MAT.win_off.clone());
      wm.position.set(x+s[0],wy,z+s[2]); wm.rotation.y=s[3]; scene.add(wm);
    });
  }
  colBoxes.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,type:'building'});
}

function addBridge(x,z,len,isNS){

// ── Input setup ──────────────────────────────────────────
function setupInput(){
  document.addEventListener('keydown',function(e){
    keys[e.code]=true;
    if(e.code==='KeyV') toggleCam();
    if(e.code==='KeyF') tryEnterVehicle();
    if(e.code==='KeyE') interact();
    if(e.code==='KeyQ') cycleWep(-1);
    if(e.code==='KeyR') cycleWep(1);
    if(e.code==='Escape') closeShop();
  });
  document.addEventListener('keyup',function(e){keys[e.code]=false;});
  document.addEventListener('mousedown',function(e){if(e.button===0)firing=true;});
  document.addEventListener('mouseup',function(e){if(e.button===0)firing=false;});
  document.addEventListener('mousemove',function(e){
    if(!mouseLocked)return;
    camH-=e.movementX*.003; camV=Math.max(-.4,Math.min(.85,camV+e.movementY*.003));
  });
  document.addEventListener('pointerlockchange',function(){
    mouseLocked=document.pointerLockElement===renderer.domElement;
  });
  document.addEventListener('wheel',function(e){camDist=Math.max(2,Math.min(22,camDist+e.deltaY*.01));},{passive:true});
  renderer.domElement.addEventListener('click',function(){
    if(!mouseLocked)renderer.domElement.requestPointerLock&&renderer.domElement.requestPointerLock();
  });
}
function setupMobile(){
  if(!('ontouchstart' in window))return;
  document.getElementById('mobile').style.display='block';
  setupJoy('jL','jLk',jL); setupJoy('jR','jRk',jR);
  ['bFire','bRun','bCar','bCam','bWep'].forEach(function(id){
    document.getElementById(id).addEventListener('touchstart',function(e){
      e.preventDefault();
      if(id==='bFire')firing=true;
      if(id==='bRun')sprinting=true;
      if(id==='bCar')tryEnterVehicle();
      if(id==='bCam')toggleCam();
      if(id==='bWep')cycleWep(1);
    },{passive:false});
    if(id==='bFire')document.getElementById(id).addEventListener('touchend',function(){firing=false;});
    if(id==='bRun')document.getElementById(id).addEventListener('touchend',function(){sprinting=false;});
  });
}
function setupJoy(bi,ki,out){
  var b=document.getElementById(bi),k=document.getElementById(ki),active=false,sx=0,sy=0,mr=34;
  b.addEventListener('touchstart',function(e){e.preventDefault();active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
  b.addEventListener('touchmove',function(e){e.preventDefault();if(!active)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    var dist=Math.min(Math.sqrt(dx*dx+dy*dy),mr),ang=Math.atan2(dy,dx);
    k.style.transform='translate('+(dist*Math.cos(ang))+'px,'+(dist*Math.sin(ang))+'px)';
    out.x=dx/mr;out.y=dy/mr;var mg=Math.sqrt(out.x*out.x+out.y*out.y);if(mg>1){out.x/=mg;out.y/=mg;}
  },{passive:false});
  b.addEventListener('touchend',function(){active=false;out.x=0;out.y=0;k.style.transform='';});
}

function update(dt){
  if(P.dead)return;
  if(!P.inVehicle)updatePlayer(dt); else updateDriving(dt);
  updateNPCs(dt); updateBullets(dt); updateExplosions(dt);
  updatePickups(dt); updateMarkers(dt); updateSubwayTrains(dt);
  checkShooting(dt); updateWanted(dt); updateCamera();
  updateHUD(); updateArea(); updateRadio(dt); dynFaction(dt);
}

var pVel={x:0,z:0};
function updatePlayer(dt){
  var spd=(sprinting||keys['ShiftLeft'])?6.5:3.8;
  var mx=0,mz=0;
  if(keys['KeyW']||keys['ArrowUp'])    {mx+=Math.sin(camH);mz+=Math.cos(camH);}
  if(keys['KeyS']||keys['ArrowDown'])  {mx-=Math.sin(camH);mz-=Math.cos(camH);}
  if(keys['KeyA']||keys['ArrowLeft'])  {mx+=Math.cos(camH);mz-=Math.sin(camH);}
  if(keys['KeyD']||keys['ArrowRight']) {mx-=Math.cos(camH);mz+=Math.sin(camH);}
  if(Math.abs(jL.x)>.08||Math.abs(jL.y)>.08){
    mx=jL.x*Math.cos(camH)+(-jL.y)*Math.sin(camH);
    mz=(-jL.y)*Math.cos(camH)-jL.x*Math.sin(camH);
    spd*=Math.min(1,Math.sqrt(jL.x*jL.x+jL.y*jL.y));
  }
  if(Math.abs(jR.x)>.08)camH-=jR.x*.04;
  if(Math.abs(jR.y)>.08)camV=Math.max(-.4,Math.min(.85,camV+jR.y*.03));
  var len=Math.sqrt(mx*mx+mz*mz);
  if(len>.01){mx/=len;mz/=len;pVel.x=mx*spd;pVel.z=mz*spd;
    P.mesh.rotation.y=Math.atan2(mx,mz);P.bobT+=dt*spd*3.5;
    if(P.mesh.userData.body)P.mesh.userData.body.position.y=.55+Math.abs(Math.sin(P.bobT))*.09;
  }else{pVel.x*=.82;pVel.z*=.82;P.bobT=0;}
  var nx=P.mesh.position.x+pVel.x*dt,nz=P.mesh.position.z+pVel.z*dt;
  if(!colTest(nx,nz,.45)){P.mesh.position.x=nx;P.mesh.position.z=nz;}
  else if(!colTest(nx,P.mesh.position.z,.45))P.mesh.position.x=nx;
  else if(!colTest(P.mesh.position.x,nz,.45))P.mesh.position.z=nz;
  P.mesh.position.x=Math.max(-390,Math.min(390,P.mesh.position.x));
  P.mesh.position.z=Math.max(-390,Math.min(390,P.mesh.position.z));
}

function updateDriving(dt){
  var v=P.inVehicle;
  var acc=keys['KeyW']||keys['ArrowUp']||jL.y<-.15;
  var brk=keys['KeyS']||keys['ArrowDown']||jL.y>.15;
  var lft=keys['KeyA']||keys['ArrowLeft']||jL.x<-.15;
  var rgt=keys['KeyD']||keys['ArrowRight']||jL.x>.15;
  if(acc)v.userData.speed=Math.min(v.userData.speed+8*dt,v.userData.maxSpeed);
  else if(brk){if(v.userData.speed>0)v.userData.speed=Math.max(0,v.userData.speed-12*dt);
    else v.userData.speed=Math.max(-v.userData.maxSpeed*.4,v.userData.speed-6*dt);}
  else v.userData.speed*=.96;
  if(keys['ShiftLeft']||sprinting)v.userData.speed*=.9;
  var sf=.045*(1-Math.abs(v.userData.speed)/v.userData.maxSpeed*.4);
  if(lft)v.rotation.y+=sf*v.userData.speed*.5;
  if(rgt)v.rotation.y-=sf*v.userData.speed*.5;
  var vx=Math.sin(v.rotation.y)*v.userData.speed,vz=Math.cos(v.rotation.y)*v.userData.speed;
  var nx=v.position.x+vx*dt,nz=v.position.z+vz*dt;
  if(!colTestV(nx,nz,v)){v.position.x=nx;v.position.z=nz;}
  else{if(Math.abs(v.userData.speed)>5){v.userData.hp-=Math.abs(v.userData.speed)*2;P.hp-=Math.abs(v.userData.speed)*.3;}v.userData.speed*=-.3;}
  v.position.x=Math.max(-380,Math.min(380,v.position.x));
  v.position.z=Math.max(-380,Math.min(380,v.position.z));
  P.mesh.position.copy(v.position);
  for(var i=0;i<colBoxes.length;i++){if(colBoxes[i].ref===v){colBoxes[i].minX=v.position.x-1.1;colBoxes[i].maxX=v.position.x+1.1;colBoxes[i].minZ=v.position.z-2.3;colBoxes[i].maxZ=v.position.z+2.3;}}
  if(v.userData.type==='police'&&P.wanted>1&&v.userData.sirenLight){
    v.userData.sirenLight.intensity=1.5;
    v.userData.sirenLight.color.setHex(Math.sin(Date.now()*.008)>0?0xff0000:0x0000ff);
  }
  document.getElementById('speedhud').style.display='block';
  document.getElementById('speedhud').textContent=Math.round(Math.abs(v.userData.speed)*3.6)+' KM/H';
}

function colTest(x,z,r){r=r||.45;for(var i=0;i<colBoxes.length;i++){var c=colBoxes[i];if(c.type==='vehicle'&&c.ref===P.inVehicle)continue;if(x+r>c.minX&&x-r<c.maxX&&z+r>c.minZ&&z-r<c.maxZ)return true;}return false;}
function colTestV(x,z,veh){for(var i=0;i<colBoxes.length;i++){var c=colBoxes[i];if(c.ref===veh)continue;if(c.type==='water')continue;if(x+1.2>c.minX&&x-1.2<c.maxX&&z+2.4>c.minZ&&z-2.4<c.maxZ)return true;}return false;}

function updateNPCs(dt){
  var px=P.mesh.position.x,pz=P.mesh.position.z;
  for(var i=0;i<npcs.length;i++){
    var n=npcs[i],ud=n.userData;
    if(ud.dead){ud.deathT-=dt;if(ud.deathT<=0){scene.remove(n);npcs.splice(i,1);i--;}continue;}
    var dx=px-n.position.x,dz=pz-n.position.z,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>160){n.visible=false;continue;}n.visible=true;
    if(ud.state==='patrol'){
      var tx=ud.patrolX-n.position.x,tz=ud.patrolZ-n.position.z,td=Math.sqrt(tx*tx+tz*tz);
      if(td<2){ud.patrolX=n.position.x+(Math.random()-.5)*35;ud.patrolZ=n.position.z+(Math.random()-.5)*35;}
      else{n.position.x+=tx/td*ud.speed*dt;n.position.z+=tz/td*ud.speed*dt;n.rotation.y=Math.atan2(tx,tz);}
    }
    if(ud.type==='police'&&P.wanted>0&&dist<50)ud.alertLvl=Math.min(100,ud.alertLvl+dt*30);
    if(ud.type==='gang'&&dist<20&&P.wanted>0)ud.alertLvl=Math.min(100,ud.alertLvl+dt*15);
    if(ud.alertLvl>50)ud.state='chase';if(ud.alertLvl>80)ud.state='attack';
    if(ud.alertLvl>0)ud.alertLvl=Math.max(0,ud.alertLvl-dt*2);
    if(ud.state==='chase'&&dist>2){n.position.x+=dx/dist*ud.speed*1.6*dt;n.position.z+=dz/dist*ud.speed*1.6*dt;n.rotation.y=Math.atan2(dx,dz);}
    if(ud.state==='attack'){
      if(dist>1.5){n.position.x+=dx/dist*ud.speed*.8*dt;n.position.z+=dz/dist*ud.speed*.8*dt;}
      n.rotation.y=Math.atan2(dx,dz);ud.shootCD-=dt;
      if(ud.shootCD<=0&&dist<(ud.weapon.range||4)){
        ud.shootCD=.6+Math.random()*.8;
        if(dist<3&&ud.weapon.range<=3){P.hp-=ud.weapon.dmg*(1-P.armor*.006);showDmg();}
        else if(dist<ud.weapon.range){
          var ang=n.rotation.y+(Math.random()-.5)*.3;
          fireBullet(n.position.x,n.position.y+1.1,n.position.z,Math.sin(ang),Math.cos(ang),ud.weapon,false);
        }
        if(P.hp<=0)killPlayer();
      }
    }
    if(ud.type==='civil'&&dist<12&&P.wanted>1){n.position.x-=dx/dist*2.2*dt;n.position.z-=dz/dist*2.2*dt;}
    for(var j=0;j<npcs.length;j++){
      var o=npcs[j];if(o===n||o.userData.dead)continue;
      if(!isEnemy(ud.faction,o.userData.faction))continue;
      var ex=o.position.x-n.position.x,ez=o.position.z-n.position.z,ed=Math.sqrt(ex*ex+ez*ez);
      if(ed<18&&ed>.5){
        ud.state='attack';ud.shootCD-=dt*.5;
        if(ud.shootCD<=0&&ed<(ud.weapon.range||4)){ud.shootCD=.8+Math.random()*.6;if(Math.random()<.4){o.userData.hp-=ud.weapon.dmg;if(o.userData.hp<=0)killNPC(o);}}
        if(ed>2){n.position.x+=ex/ed*ud.speed*.5*dt;n.position.z+=ez/ed*ud.speed*.5*dt;n.rotation.y=Math.atan2(ex,ez);}
      }
    }
  }
}
function isEnemy(a,b){if(a===b||a==='civil'||b==='civil')return false;var e={biker:['balkan','russian'],balkan:['biker','white','russian'],russian:['biker','balkan'],white:['balkan','biker'],police:['biker','balkan','russian','white']};return e[a]&&e[a].indexOf(b)>=0;}
function killNPC(n){n.userData.dead=true;n.userData.deathT=8;n.rotation.z=Math.PI/2;n.position.y=-.3;spawnBlood(n.position.x,n.position.z);if(P.missionActive){P.missionKills++;checkMissionProg();}if(Math.random()<.3)spawnWepPickup(n.position.x,n.position.z);}

function spawnWepPickup(x,z){var wid=2+Math.floor(Math.random()*5);var m=new THREE.Mesh(box3(.5,.5,.5),new THREE.MeshBasicMaterial({color:WEAPONS[wid].col,wireframe:true}));m.position.set(x,.6,z);m.userData={type:'weapon',wid:wid};scene.add(m);pickups.push(m);}

var shootCD=0;
function checkShooting(dt){
  if(!firing||P.inVehicle)return;
  var w=P.weapons[P.weapon];shootCD-=dt;if(shootCD>0)return;
  shootCD=w.auto?.1:.4;
  if(w.ammo===0){showMsg('TOMT MAGASIN!');return;}
  if(w.ammo>0)w.ammo--;
  var dx=Math.sin(camH)+(Math.random()-.5)*.04,dz=Math.cos(camH)+(Math.random()-.5)*.04;
  var len=Math.sqrt(dx*dx+dz*dz);
  if(w.range<=3){hitNear(P.mesh.position.x,P.mesh.position.z,w.range,w.dmg);}
  else fireBullet(P.mesh.position.x,P.mesh.position.y+1.2,P.mesh.position.z,dx/len,dz/len,w,true);

function fireBullet(x,y,z,dx,dz,weapon,fromP){
  var geo=new THREE.SphereGeometry(.08,4,4);
  var mat=new THREE.MeshBasicMaterial({color:fromP?0xffff44:0xff4422});

  bullets.push({mesh:m,dx:dx,dz:dz,speed:weapon.range*4,dmg:weapon.dmg,dist:0,maxDist:weapon.range,fromP:fromP,weapon:weapon});
}
function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i],mx2=b.dx*b.speed*dt,mz2=b.dz*b.speed*dt;
    b.mesh.position.x+=mx2;b.mesh.position.z+=mz2;b.dist+=Math.sqrt(mx2*mx2+mz2*mz2);
    var hit=false;
    if(b.fromP){
      for(var j=0;j<npcs.length;j++){
        var n=npcs[j];if(n.userData.dead)continue;
        var nd=Math.sqrt(Math.pow(n.position.x-b.mesh.position.x,2)+Math.pow(n.position.z-b.mesh.position.z,2));
        if(nd<.8){n.userData.hp-=b.dmg;spawnBlood(n.position.x,n.position.z);if(n.userData.hp<=0)killNPC(n);else{n.userData.state='attack';n.userData.alertLvl=100;}addWanted(.1);hit=true;break;}
      }
    }else{
      var pd=Math.sqrt(Math.pow(P.mesh.position.x-b.mesh.position.x,2)+Math.pow(P.mesh.position.z-b.mesh.position.z,2));
      if(pd<.7){P.hp-=b.dmg*(1-P.armor*.007);showDmg();hit=true;if(P.hp<=0)killPlayer();}
    }
    if(b.weapon.range<=8&&b.dist>b.maxDist*.4&&!hit){spawnExplosion(b.mesh.position.x,b.mesh.position.z,b.weapon.dmg);hit=true;}
    if(b.dist>b.maxDist||colTest(b.mesh.position.x,b.mesh.position.z,.2))hit=true;
    if(hit){scene.remove(b.mesh);bullets.splice(i,1);}
  }
}
function hitNear(x,z,range,dmg){npcs.forEach(function(n){if(n.userData.dead)return;var d=Math.sqrt(Math.pow(n.position.x-x,2)+Math.pow(n.position.z-z,2));if(d<range){n.userData.hp-=dmg;spawnBlood(n.position.x,n.position.z);if(n.userData.hp<=0)killNPC(n);else n.userData.state='attack';}});}
function spawnExplosion(x,z,dmg){
  var geo=new THREE.SphereGeometry(1,8,6);

  var pd=Math.sqrt(Math.pow(P.mesh.position.x-x,2)+Math.pow(P.mesh.position.z-z,2));

}
function updateExplosions(dt){
  for(var i=explosions.length-1;i>=0;i--){
    var e=explosions[i];e.t-=dt;var prog=1-e.t/e.maxT;

function updatePickups(dt){
  var px=P.mesh.position.x,pz=P.mesh.position.z;

    var pk=pickups[i];

function updateSubwayTrains(dt){
  subwayTrains.forEach(function(train){
    var ud=train.userData;ud.t+=dt*ud.speed;
    var d=ud.t*ud.totalLen%ud.totalLen,acc=0;
    for(var i=0;i<ud.pts.length-1;i++){
      var a=ud.pts[i],b=ud.pts[i+1];
      var seg=Math.sqrt(Math.pow(b[0]-a[0],2)+Math.pow(b[1]-a[1],2));
      if(acc+seg>=d){var frac=(d-acc)/seg;train.position.x=a[0]+(b[0]-a[0])*frac;train.position.z=a[1]+(b[1]-a[1])*frac;train.rotation.y=Math.atan2(b[0]-a[0],b[1]-a[1]);break;}
      acc+=seg;
    }
  });
}
function dynFaction(dt){dynT-=dt;if(dynT>0)return;dynT=25+Math.random()*30;var fkeys=['biker','balkan','russian','white'];var f1=fkeys[Math.floor(Math.random()*4)],f2=fkeys[Math.floor(Math.random()*4)];if(f1===f2||!isEnemy(f1,f2))return;var ex=(Math.random()-.5)*150,ez=(Math.random()-.5)*150;for(var i=0;i<3;i++){var n=makeNPC(ex+(Math.random()-.5)*8,ez+(Math.random()-.5)*8,f1,'gang');n.userData.alertLvl=100;n.userData.state='attack';}for(var i=0;i<3;i++){var n=makeNPC(ex+(Math.random()-.5)*8,ez+(Math.random()-.5)*8,f2,'gang');n.userData.alertLvl=100;n.userData.state='attack';}}
function killPlayer(){if(P.dead)return;P.dead=true;P.hp=0;exitVehicle();var ds=document.getElementById('dead');ds.style.display='flex';setTimeout(function(){ds.classList.add('show');setTimeout(function(){document.getElementById('dead-t').style.display='block';document.getElementById('dead-s').style.display='block';document.getElementById('dead-b').style.display='block';},1000);},200);}
function respawn(){P.dead=false;P.hp=100;P.armor=0;P.money=Math.max(0,P.money-200);P.wanted=0;P.weapon=0;P.weapons=[JSON.parse(JSON.stringify(WEAPONS[0]))];P.mesh.position.set(0,.05,0);pVel.x=0;pVel.z=0;var ds=document.getElementById('dead');ds.classList.remove('show');ds.style.display='none';['dead-t','dead-s','dead-b'].forEach(function(id){document.getElementById(id).style.display='none';});showMsg('ARRESTERAD. $200 BÖTER.');updateWepHUD();}
function openShop(name){document.getElementById('shop').style.display='flex';document.getElementById('shoptitle').textContent=name;document.getElementById('shopcash').textContent='PENGAR: $'+P.money.toLocaleString();var items=document.getElementById('shopitems');items.innerHTML='';var si=name==='VAPENAFFÄR'?WEAPONS.filter(function(w){return w.price>0;}):
  [{name:'BIKER JACKA',price:300,type:'armor'},{name:'BALKAN ROCK',price:400,type:'armor'},{name:'RYSK KAPPA',price:500,type:'armor'},{name:'VIT KOSTYM',price:800,type:'armor'}];
si.forEach(function(item){var div=document.createElement('div');div.className='sitem';div.innerHTML=item.name+'<span class="sp">$'+item.price+'</span>';div.addEventListener('click',function(){if(P.money>=item.price){P.money-=item.price;if(item.type==='armor'){P.armor=Math.min(100,P.armor+40);showMsg('RUSTNING +40');}else giveWep(WEAPONS.indexOf(item));document.getElementById('shopcash').textContent='PENGAR: $'+P.money.toLocaleString();}else showMsg('INTE TILLRÄCKLIGT MED PENGAR');});items.appendChild(div);});}
function closeShop(){document.getElementById('shop').style.display='none';}
function showDlg(name,text){document.getElementById('dlg').style.display='block';document.getElementById('dlgname').textContent=name.toUpperCase();document.getElementById('dlgtxt').textContent=text;setTimeout(closeDlg,7000);}
function closeDlg(){document.getElementById('dlg').style.display='none';}
function showMsg(t){var el=document.getElementById('msgbox');el.innerHTML=t.replace(/\n/g,'<br>');el.style.opacity='1';clearTimeout(showMsg._t);showMsg._t=setTimeout(function(){el.style.opacity='0';},3200);}
function showDmg(){document.getElementById('hud').style.background='rgba(200,0,0,.18)';setTimeout(function(){document.getElementById('hud').style.background='';},100);}
function updateWepHUD(){var w=P.weapons[P.weapon];document.getElementById('wname').textContent=w.name;document.getElementById('wammo').textContent=w.ammo<0?'∞':w.ammo+'/'+w.max;}
function updateHUD(){document.getElementById('hpfill').style.width=Math.max(0,P.hp)+'%';document.getElementById('afill').style.width=P.armor+'%';document.getElementById('money').textContent='$'+P.money.toLocaleString();['s1','s2','s3'].forEach(function(id,i){document.getElementById(id).className='star'+(i<Math.ceil(P.wanted)?' on':'');});}
function updateArea(){var px=P.mesh.position.x,pz=P.mesh.position.z,best='STOCKHOLM',bd=9999;AREAS.forEach(function(a){var d=Math.sqrt(Math.pow(px-a.x,2)+Math.pow(pz-a.z,2));if(d<a.r&&d<bd){bd=d;best=a.name;}});if(best!==currentArea){currentArea=best;var el=document.getElementById('areatxt');el.textContent=best;el.style.opacity='1';setTimeout(function(){el.style.opacity='0';},3000);}}
function updateRadio(dt){radioT+=dt;if(radioT>60){radioT=0;radioIdx=(radioIdx+1)%RADIO.length;document.getElementById('radio').textContent=RADIO[radioIdx];}}

// ── Minimap ─────────────────────────────────────────────
var mmCtx=document.getElementById('minimap').getContext('2d');
function drawMinimap(){
  var ms=130,sc=ms/280;
  var px=P.inVehicle?P.inVehicle.position.x:P.mesh.position.x;
  var pz=P.inVehicle?P.inVehicle.position.z:P.mesh.position.z;
  mmCtx.fillStyle='#06080e';mmCtx.fillRect(0,0,ms,ms);
  var cx=ms/2,cy=ms/2;
  function wx(x){return cx+(x-px)*sc;}function wy(z){return cy+(z-pz)*sc;}
  [{x:-120,z:-20,r:50,c:'rgba(255,100,0,.14)'},{x:0,z:0,r:60,c:'rgba(200,0,0,.11)'},
   {x:40,z:-40,r:45,c:'rgba(220,170,0,.11)'},{x:20,z:-120,r:50,c:'rgba(100,100,200,.11)'}].forEach(function(t){
    mmCtx.fillStyle=t.c;mmCtx.beginPath();mmCtx.arc(wx(t.x),wy(t.z),t.r*sc,0,Math.PI*2);mmCtx.fill();});
  mmCtx.strokeStyle='#22222e';mmCtx.lineWidth=4;
  [[0,-200,0,200],[-200,0,200,0],[-200,-40,200,-40],[-200,-80,200,-80],
   [-200,-120,200,-120],[-200,60,200,60],[40,-200,40,200],[-40,-200,-40,200]].forEach(function(r){
    mmCtx.beginPath();mmCtx.moveTo(wx(r[0]),wy(r[1]));mmCtx.lineTo(wx(r[2]),wy(r[3]));mmCtx.stroke();});
  [{c:'#cc2222',p:[[40,-40],[0,2],[-50,62],[22,62]]},{c:'#228833',p:[[40,-62],[40,-82],[22,-120],[-40,-40]]},{c:'#2255cc',p:[[-82,-40],[40,-40],[72,-40]]}].forEach(function(l){
    mmCtx.strokeStyle=l.c;mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.moveTo(wx(l.p[0][0]),wy(l.p[0][1]));
    for(var i=1;i<l.p.length;i++)mmCtx.lineTo(wx(l.p[i][0]),wy(l.p[i][1]));mmCtx.stroke();});
  npcs.forEach(function(n){if(!n.visible||n.userData.dead)return;var f=FACTIONS[n.userData.faction];
    mmCtx.fillStyle=f?('#'+f.acc.toString(16).padStart(6,'0')):'#aaa';
    mmCtx.fillRect(wx(n.position.x)-1.5,wy(n.position.z)-1.5,3,3);});
  mmCtx.fillStyle='#ffffff44';vehicles.forEach(function(v){mmCtx.fillRect(wx(v.position.x)-2.5,wy(v.position.z)-1.5,5,3);});
  missionMarkers.forEach(function(m){if(!m.userData.active&&!m.userData.isTarget)return;
    mmCtx.fillStyle=m.userData.isTarget?'#ff2222':'#ffdd00';mmCtx.fillRect(wx(m.position.x)-3,wy(m.position.z)-3,6,6);});
  if(P.wanted>1){mmCtx.strokeStyle='#ff2222';mmCtx.lineWidth=2;mmCtx.strokeRect(1,1,ms-2,ms-2);}
  mmCtx.fillStyle='#ffdd44';mmCtx.beginPath();mmCtx.arc(cx,cy,5,0,Math.PI*2);mmCtx.fill();
  var pr=P.inVehicle?P.inVehicle.rotation.y:P.mesh.rotation.y;
  mmCtx.strokeStyle='#ffdd44';mmCtx.lineWidth=1.5;mmCtx.beginPath();mmCtx.moveTo(cx,cy);mmCtx.lineTo(cx+Math.sin(pr)*9,cy+Math.cos(pr)*9);mmCtx.stroke();
  mmCtx.strokeStyle='#ffffff18';mmCtx.lineWidth=1;mmCtx.strokeRect(0,0,ms,ms);
  mmCtx.fillStyle='#ff6a0077';mmCtx.font='8px Courier New';mmCtx.fillText('N',cx-3,9);
}

// ── Loop ────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.05);
  frameN++;
  if(frameN%150===0&&npcs.length<80){var ang=Math.random()*Math.PI*2,dist=65+Math.random()*30,fArr=['civil','civil','civil','biker','balkan','russian','white','police'],f=fArr[Math.floor(Math.random()*fArr.length)];makeNPC(P.mesh.position.x+Math.cos(ang)*dist,P.mesh.position.z+Math.sin(ang)*dist,f,f==='police'?'police':f==='civil'?'civil':'gang');}
  if(frameN%400===0){for(var i=npcs.length-1;i>=0;i--){var n=npcs[i];var d=Math.sqrt(Math.pow(n.position.x-P.mesh.position.x,2)+Math.pow(n.position.z-P.mesh.position.z,2));if(d>180&&!n.userData.dead){scene.remove(n);npcs.splice(i,1);}}}
  if(frameN%600===0)spawnWepPickup((Math.random()-.5)*180,(Math.random()-.5)*180);
  update(dt);
  drawMinimap();
  renderer.render(scene,camera);
}

window.addEventListener('load', function() {
  var attempts = 0;
  function waitForThree() {
    attempts++;
    if (typeof THREE !== 'undefined') {
      init();
    } else if (attempts < 60) {
      setTimeout(waitForThree, 200);
    } else {
      document.getElementById('load-sub').textContent = 'FEL: Three.js laddades inte';
      document.getElementById('load-sub').style.color = '#ff4444';
    }
  }
  waitForThree();
});
</script>
