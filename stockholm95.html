<script>
'use strict';
// ═══════════════════════════════════════════════════════
//  STOCKHOLM '95 — Pure Canvas 2D, Zero Dependencies
//  Isometric top-down GTA-style game
// ═══════════════════════════════════════════════════════

var C = document.getElementById('c');
var ctx = C.getContext('2d');
C.width = window.innerWidth;
C.height = window.innerHeight;
window.addEventListener('resize', function(){
  C.width = window.innerWidth; C.height = window.innerHeight; buildMinimap();
});

// ── Camera ─────────────────────────────────────────
var cam = { x:0, y:0, zoom:1.8, rot:0 };
var targetZoom = 1.8;

// ── Input ──────────────────────────────────────────
var keys = {};
var jL={x:0,y:0}, jR={x:0,y:0};
var firing=false, sprinting=false;
document.addEventListener('keydown', function(e){
  keys[e.code]=true;
  if(e.code==='KeyV') toggleCam();
  if(e.code==='KeyF') tryEnterVehicle();
  if(e.code==='KeyE') interact();
  if(e.code==='KeyQ') cycleWep(-1);
  if(e.code==='KeyR') cycleWep(1);
  if(e.code==='Escape') closeShop();
});
document.addEventListener('keyup', function(e){ keys[e.code]=false; });
C.addEventListener('mousedown', function(e){ if(e.button===0) firing=true; });
C.addEventListener('mouseup',   function(e){ if(e.button===0) firing=false; });
C.addEventListener('wheel', function(e){
  targetZoom = Math.max(0.8, Math.min(3.5, targetZoom - e.deltaY*0.001));
}, {passive:true});

// Mouse world position
var mouseWX=0, mouseWZ=0;
C.addEventListener('mousemove', function(e){
  var s = screenToWorld(e.clientX, e.clientY);
  mouseWX = s.x; mouseWZ = s.z;
});

// ── Projection ─────────────────────────────────────
var ISO_ANGLE = 0.5;  // tilt (radians from top)
function worldToScreen(wx, wz, wy) {
  wy = wy||0;
  var px = wx - cam.x, pz = wz - cam.y;
  var rx = px * Math.cos(cam.rot) - pz * Math.sin(cam.rot);
  var rz = px * Math.sin(cam.rot) + pz * Math.cos(cam.rot);
  return {
    x: C.width/2  + rx * cam.zoom * 8,
    y: C.height/2 + (-rz * Math.cos(ISO_ANGLE) - wy * Math.sin(ISO_ANGLE)) * cam.zoom * 8
  };
}
function screenToWorld(sx, sy) {
  var rx = (sx - C.width/2) / (cam.zoom*8);
  var ry = (sy - C.height/2) / (cam.zoom*8);
  var rz = -ry / Math.cos(ISO_ANGLE);
  var wx = rx * Math.cos(-cam.rot) - rz * Math.sin(-cam.rot) + cam.x;
  var wz = rx * Math.sin(-cam.rot) + rz * Math.cos(-cam.rot) + cam.y;
  return {x:wx, z:wz};
}

// ── Color helpers ───────────────────────────────────
function shadeCol(hex, amt) {
  var n=parseInt(hex.slice(1),16)||0;
  var r=Math.min(255,Math.max(0,((n>>16)&255)+amt));
  var g=Math.min(255,Math.max(0,((n>>8)&255)+amt));
  var b=Math.min(255,Math.max(0,(n&255)+amt));
  return 'rgb('+r+','+g+','+b+')';
}
function hexCol(n){ return '#'+n.toString(16).padStart(6,'0'); }

// ── Seeded random ───────────────────────────────────
function seededRand(seed){
  var s=seed;
  return function(){ s=(s*1664525+1013904223)&0xffffffff; return (s>>>0)/0xffffffff; };
}

// ═══════════════════════════════════════════════════
//  WORLD DATA
// ═══════════════════════════════════════════════════
var world = {
  ground:   [], water:[], parks:[],
  roads:    [], sidewalks:[],
  buildings:[],  // {x,z,w,d,h,col,name,desc}
  bridges:  [],
  lights:   [],
  markers:  [],  // mission / shop markers
  subway:   []   // station entrances
};
var colBoxes = []; // collision {minX,maxX,minZ,maxZ,type}

function buildWorld() {
  // Ground
  world.ground.push({x:0,z:0,w:900,d:900,col:'#101014'});
  
  // Water
  world.water.push({x:-80,z:80,w:300,d:120,col:'#071520'});
  world.water.push({x:120,z:40,w:200,d:80,col:'#071520'});
  world.water.push({x:-100,z:130,w:120,d:60,col:'#071520'});

  // Parks
  var parks=[
    {x:-30,z:70,w:60,d:40},{x:18,z:-122,w:50,d:40},
    {x:-82,z:28,w:40,d:36},{x:32,z:80,w:30,d:24},
    {x:10,z:-88,w:30,d:24},{x:-118,z:22,w:20,d:20},
    {x:65,z:-85,w:25,d:20},{x:-50,z:50,w:22,d:18},
  ];
  parks.forEach(function(p){ world.parks.push({x:p.x,z:p.z,w:p.w,d:p.d,col:'#0f1f0f'}); });

  // Roads
  var roads=[
    {x:0,z:0,w:420,d:9,h:true},{x:0,z:-40,w:420,d:9,h:true},
    {x:0,z:-80,w:420,d:8,h:true},{x:0,z:-120,w:420,d:9,h:true},
    {x:0,z:60,w:380,d:8,h:true},{x:0,z:120,w:300,d:7,h:true},
    {x:0,z:0,w:9,d:420,h:false},{x:-40,z:0,w:9,d:420,h:false},
    {x:40,z:0,w:9,d:420,h:false},{x:80,z:0,w:8,d:320,h:false},
    {x:-80,z:0,w:8,d:320,h:false},{x:-120,z:0,w:8,d:280,h:false},
    {x:120,z:0,w:7,d:280,h:false},{x:-20,z:30,w:5,d:80,h:false},
    {x:20,z:-20,w:5,d:60,h:false},{x:60,z:-60,w:5,d:80,h:false},
  ];
  roads.forEach(function(r){
    world.roads.push(r);
    // Sidewalks
    var off = (r.h ? r.d : r.w)/2 + 1.8;
    world.sidewalks.push({x:r.x+(r.h?0:-off), z:r.z+(r.h?-off:0), w:r.h?r.w:2.5, d:r.h?2.5:r.d, col:'#1a1a26'});
    world.sidewalks.push({x:r.x+(r.h?0:off),  z:r.z+(r.h?off:0),  w:r.h?r.w:2.5, d:r.h?2.5:r.d, col:'#1a1a26'});
  });

  // Buildings
  buildDistrict( 0,   0,  75, 0x181c20, 4, 22, 'slussen');
  buildDistrict(-30,  65, 100, 0x161a16, 4, 18, 'sodermalm');
  buildDistrict(-120,-20,  65, 0x1a1a1c, 3, 14, 'fridhemsplan');
  buildDistrict( 20,-120,  65, 0x1c2022, 5, 22, 'odenplan');
  buildDistrict( 40, -40,  58, 0x181c22, 6, 26, 'tcentralen');
  buildDistrict(-80, -25,  75, 0x1a1c1a, 4, 16, 'kungsholmen');
  buildDistrict( 10, -85,  65, 0x1c1c1e, 4, 18, 'vasastan');
  buildDistrict( 60, 120,  55, 0x14161a, 3, 12, 'dockorna');

  // Landmarks
  addBuilding(-84,-27,22,18,38,'#9a8a78','STADSHUSET','Stockholms Stadshus 1923. Nobelmiddagen hålls här.');
  addBuilding( 40,-40,24,18,14,'#706858','CENTRALSTATIONEN','Invigd 1871. Hub för järnväg och tunnelbana.');
  addBuilding( 32, 80,12,14,26,'#706050','KATARINA KYRKA','Bränd 1990, återinvigd 1995 — nybyggd detta år!');
  addBuilding( 40,-38,16,12,18,'#665555','NK','Nordiska Kompaniet. Stockholms mest kända varuhus.');
  addBuilding(-84,-40, 8, 8,45,'#887060','STADSHUSTORNET','Torn 106m med Tre Kronor.');
  addBuilding( 65,140,26,26,12,'#1a2a4a','GLOBEN','Invigd 1989. Diameter 110m. Världens största sfär.');

  // Bridges
  addBridge(-10,38,80,false);
  addBridge( 62,25,60,false);
  addBridge( 12, 8,22,true);
  addBridge(-90,40,30,false);

  // Street lights
  var lpos=[
    [0,20],[0,-20],[0,-60],[0,-100],[40,20],[40,-20],[40,-60],
    [-40,20],[-40,-20],[-40,-60],[80,0],[80,-40],[-80,0],[-80,-40],
    [20,0],[20,-40],[20,-80],[20,-120],[-20,0],[-120,0],[60,60],
  ];
  lpos.forEach(function(p){ world.lights.push({x:p[0]+4,z:p[1]+4}); });

  // Territory spray paint
  world.markers.push({type:'territory',x:-120,z:-20,r:50,col:'rgba(255,100,0,.12)',label:'MC'});
  world.markers.push({type:'territory',x:0,z:0,r:60,col:'rgba(200,0,0,.10)',label:'BALKAN'});
  world.markers.push({type:'territory',x:40,z:-40,r:45,col:'rgba(220,170,0,.10)',label:'RYSKA'});
  world.markers.push({type:'territory',x:20,z:-120,r:50,col:'rgba(100,100,220,.10)',label:'VIT KRAGE'});

  // Subway stations
  var stations=[
    {n:'T-CENTRALEN',x:40,z:-40,col:'#ffffff'},{n:'SLUSSEN',x:0,z:2,col:'#cc2222'},
    {n:'HORNSTULL',x:-50,z:62,col:'#cc2222'},{n:'MEDBORGARPLATSEN',x:18,z:32,col:'#cc2222'},
    {n:'SKANSTULL',x:22,z:62,col:'#cc2222'},{n:'FRIDHEMSPLAN',x:-40,z:-40,col:'#2255cc'},
    {n:'RÅDHUSET',x:8,z:-40,col:'#2255cc'},{n:'STADSHAGEN',x:-82,z:-40,col:'#2255cc'},
    {n:'HÖTORGET',x:40,z:-62,col:'#228833'},{n:'ODENPLAN',x:22,z:-120,col:'#228833'},
    {n:'RÅDMANSGATAN',x:40,z:-82,col:'#228833'},{n:"S:T ERIKSPLAN",x:-18,z:-82,col:'#228833'},
    {n:'KUNGSTRÄDGÅRDEN',x:72,z:-40,col:'#2255cc'},{n:'ZINKENSDAMM',x:-30,z:42,col:'#cc2222'},
    {n:'MARIATORGET',x:-18,z:20,col:'#cc2222'},
  ];
  stations.forEach(function(s){
    world.subway.push(s);
    addBuilding(s.x,s.z,4,4,2.5,'#1a2244',s.n,'Tunnelbanestation — '+s.n);
  });
}

function buildDistrict(cx,cz,radius,baseCol,minH,maxH,tag){
  var rnd=seededRand(cx*7+cz*13+radius);
  var blockCount=Math.floor(radius/13);
  for(var bx=-blockCount;bx<=blockCount;bx++){
    for(var bz=-blockCount;bz<=blockCount;bz++){
      var wx=cx+bx*14+(rnd()-.5)*3;
      var wz=cz+bz*14+(rnd()-.5)*3;
      if(Math.sqrt((wx-cx)*(wx-cx)+(wz-cz)*(wz-cz))>radius) continue;
      var w=5+rnd()*6, d=5+rnd()*6, h=minH+rnd()*(maxH-minH);
      var shade=Math.floor(rnd()*0x101010);
      var col=hexCol(baseCol+shade);
      addBuilding(wx,wz,w,d,h,col,'','');
    }
  }
}

function addBuilding(x,z,w,d,h,col,name,desc){
  world.buildings.push({x:x,z:z,w:w,d:d,h:h,col:col,name:name,desc:desc});
  colBoxes.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2,type:'building'});
}

function addBridge(x,z,len,isNS){
  world.bridges.push({x:x,z:z,len:len,isNS:isNS});
  colBoxes.push({minX:x-3.5,maxX:x+3.5,minZ:z-(isNS?len/2:3.5),maxZ:z+(isNS?len/2:3.5),type:'bridge'});
}

// ═══════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════
var WEAPONS=[
  {name:'KNYTNÄVAR',ammo:-1,maxAmmo:-1,dmg:20,range:2.5,auto:false,price:0},
  {name:'JÄRNRÖR',  ammo:-1,maxAmmo:-1,dmg:35,range:3.0,auto:false,price:0},
  {name:'KNIV',     ammo:-1,maxAmmo:-1,dmg:45,range:2.2,auto:false,price:200},
  {name:'PISTOL',   ammo:24,maxAmmo:80, dmg:30,range:40, auto:false,price:500},
  {name:'REVOLVER', ammo:6, maxAmmo:30, dmg:55,range:50, auto:false,price:800},
  {name:'UZI',      ammo:30,maxAmmo:120,dmg:22,range:30, auto:true, price:1200},
  {name:'HAGELGEVÄR',ammo:6,maxAmmo:24, dmg:80,range:15, auto:false,price:1500},
  {name:'AK-47',    ammo:30,maxAmmo:150,dmg:40,range:60, auto:true, price:3000},
  {name:'GRANAT',   ammo:2, maxAmmo:6,  dmg:150,range:8, auto:false,price:800},
  {name:'MOLOTOV',  ammo:3, maxAmmo:8,  dmg:80, range:7, auto:false,price:400},
];

var FACTIONS={
  biker:  {col:'#222222',acc:'#ff6600',base:{x:-120,z:-20}},
  balkan: {col:'#1a1a2e',acc:'#cc2222',base:{x:0,z:0}},
  russian:{col:'#1e2d1e',acc:'#ddaa00',base:{x:40,z:-40}},
  white:  {col:'#334455',acc:'#8888cc',base:{x:20,z:-120}},
  police: {col:'#003388',acc:'#ffffff',base:{x:0,z:0}},
  civil:  {col:'#445566',acc:'#99aacc',base:{x:0,z:0}},
};

var AREAS=[
  {name:'SLUSSEN',x:0,z:0,r:70},{name:'SÖDERMALM',x:-30,z:65,r:100},

var mmCanvas=document.getElementById('minimap');
var mmCtx=mmCanvas.getContext('2d');
var mmCache=null;
function buildMinimap(){
  var ms=130,sc=ms/280;
  var tmp=document.createElement('canvas');tmp.width=ms;tmp.height=ms;
  var tc=tmp.getContext('2d');
  tc.fillStyle='#06080e';tc.fillRect(0,0,ms,ms);
  var cx=ms/2,cy=ms/2;
  function wx(x){return cx+x*sc;}function wy(z){return cy+z*sc;}
  // Roads
  tc.strokeStyle='#22222e';tc.lineWidth=4;
  [[0,-200,0,200],[-200,0,200,0],[-200,-40,200,-40],[-200,-80,200,-80],
   [-200,-120,200,-120],[-200,60,200,60],[40,-200,40,200],[-40,-200,-40,200],
   [80,-200,80,200],[-80,-200,-80,200]].forEach(function(r){
    tc.beginPath();tc.moveTo(wx(r[0]),wy(r[1]));tc.lineTo(wx(r[2]),wy(r[3]));tc.stroke();});
  // Subway
  [{c:'#cc2222',p:[[40,-40],[0,2],[-50,62],[22,62]]},
   {c:'#228833',p:[[40,-62],[40,-82],[22,-120],[-40,-40]]},
   {c:'#2255cc',p:[[-82,-40],[40,-40],[72,-40]]}].forEach(function(l){
    tc.strokeStyle=l.c;tc.lineWidth=1.5;tc.beginPath();
    tc.moveTo(wx(l.p[0][0]),wy(l.p[0][1]));
    for(var i=1;i<l.p.length;i++)tc.lineTo(wx(l.p[i][0]),wy(l.p[i][1]));tc.stroke();});
  // Water
  tc.fillStyle='#071520';
  tc.fillRect(wx(-230)-1,wy(20)-1,300*sc+2,120*sc+2);
  tc.fillRect(wx(20)-1,wy(0)-1,200*sc+2,80*sc+2);
  // Parks
  tc.fillStyle='#0f1f0f';
  world.parks.forEach(function(p){tc.fillRect(wx(p.x-p.w/2),wy(p.z-p.d/2),p.w*sc,p.d*sc);});
  tc.font='7px Courier New';tc.fillStyle='#ff6a0044';tc.fillText('N',cx-3,8);
  mmCache=tmp;
}

function colTest(x,z,r){
  r=r||0.45;
  for(var i=0;i<colBoxes.length;i++){
    var c=colBoxes[i];
    if(c.type==='vehicle'&&c.ref===P.inVehicle) continue;
    if(x+r>c.minX&&x-r<c.maxX&&z+r>c.minZ&&z-r<c.maxZ) return true;
  }
  return false;
}
function colTestVehicle(x,z,veh){
  for(var i=0;i<colBoxes.length;i++){
    var c=colBoxes[i];
    if(c.ref===veh) continue;
    if(c.type==='water') continue;
    if(x+1.2>c.minX&&x-1.2<c.maxX&&z+2.4>c.minZ&&z-2.4<c.maxZ) return true;
  }
  return false;
}

function update(dt){
  if(P.dead){return;}
  cam.zoom+=(targetZoom-cam.zoom)*.1;
  if(!P.inVehicle) updatePlayer(dt);
  else updateDriving(dt);
  updateNPCs(dt);
  updateBullets(dt);
  updateExplosions(dt);
  updatePickups(dt);
  updateMissionMarkers(dt);
  checkShooting(dt);
  updateWanted(dt);
  updateArea();
  updateRadio(dt);
  dynFactionEvents(dt);
  // Camera follow
  var tx=P.inVehicle?P.inVehicle.x:P.x;
  var tz=P.inVehicle?P.inVehicle.z:P.z;
  cam.x+=(tx-cam.x)*.12;
  cam.y+=(tz-cam.y)*.12;
}

var pVel={x:0,z:0};
function updatePlayer(dt){
  var spd=(sprinting||keys['ShiftLeft'])?6.5:3.8;
  var mx=0,mz=0;
  if(keys['KeyW']||keys['ArrowUp'])    {mx+=Math.sin(P.rot);mz+=Math.cos(P.rot);}
  if(keys['KeyS']||keys['ArrowDown'])  {mx-=Math.sin(P.rot);mz-=Math.cos(P.rot);}
  if(keys['KeyA']||keys['ArrowLeft'])  {P.rot-=dt*3;}
  if(keys['KeyD']||keys['ArrowRight']) {P.rot+=dt*3;}
  // Joystick
  if(Math.abs(jL.x)>.08||Math.abs(jL.y)>.08){
    mx=jL.x;mz=-jL.y;spd*=Math.min(1,Math.sqrt(jL.x*jL.x+jL.y*jL.y));
    var len=Math.sqrt(mx*mx+mz*mz);if(len>.01)P.rot=Math.atan2(mx,mz);
  }
  if(Math.abs(jR.x)>.08) P.rot+=jR.x*.05;
  var len=Math.sqrt(mx*mx+mz*mz);
  if(len>.01){
    mx/=len;mz/=len;pVel.x=mx*spd;pVel.z=mz*spd;
    P.bobT+=dt*spd*3.5;
  } else {pVel.x*=.82;pVel.z*=.82;}
  var nx=P.x+pVel.x*dt, nz=P.z+pVel.z*dt;
  if(!colTest(nx,nz)){P.x=nx;P.z=nz;}
  else if(!colTest(nx,P.z)){P.x=nx;}
  else if(!colTest(P.x,nz)){P.z=nz;}
  P.x=Math.max(-390,Math.min(390,P.x));
  P.z=Math.max(-390,Math.min(390,P.z));
}

function updateDriving(dt){
  var v=P.inVehicle;
  var acc=keys['KeyW']||keys['ArrowUp']||jL.y<-.15;
  var brk=keys['KeyS']||keys['ArrowDown']||jL.y>.15;
  var lft=keys['KeyA']||keys['ArrowLeft']||jL.x<-.15;
  var rgt=keys['KeyD']||keys['ArrowRight']||jL.x>.15;
  if(acc) v.speed=Math.min(v.speed+8*dt,v.maxSpeed);
  else if(brk){ if(v.speed>0)v.speed=Math.max(0,v.speed-12*dt);else v.speed=Math.max(-v.maxSpeed*.4,v.speed-6*dt);}
  else v.speed*=.96;
  if(keys['ShiftLeft']||sprinting)v.speed*=.9;
  var sf=.045*(1-Math.abs(v.speed)/v.maxSpeed*.4);
  if(lft)v.rot+=sf*v.speed*.5; if(rgt)v.rot-=sf*v.speed*.5;
  var vx=Math.sin(v.rot)*v.speed,vz=Math.cos(v.rot)*v.speed;
  var nx=v.x+vx*dt,nz=v.z+vz*dt;
  if(!colTestVehicle(nx,nz,v)){v.x=nx;v.z=nz;}
  else{if(Math.abs(v.speed)>5){v.hp-=Math.abs(v.speed)*2;P.hp-=Math.abs(v.speed)*.3;}v.speed*=-.3;}
  v.x=Math.max(-380,Math.min(380,v.x));v.z=Math.max(-380,Math.min(380,v.z));
  P.x=v.x;P.z=v.z;
  for(var i=0;i<colBoxes.length;i++){if(colBoxes[i].ref===v){colBoxes[i].minX=v.x-1.1;colBoxes[i].maxX=v.x+1.1;colBoxes[i].minZ=v.z-2.3;colBoxes[i].maxZ=v.z+2.3;}}
  document.getElementById('speed-hud').style.display='block';
  document.getElementById('speed-hud').textContent=Math.round(Math.abs(v.speed)*3.6)+' KM/H';
}

function updateNPCs(dt){
  for(var i=0;i<npcs.length;i++){
    var n=npcs[i];
    if(n.dead){n.deathT-=dt;if(n.deathT<=0){npcs.splice(i,1);i--;}continue;}
    var dx=P.x-n.x,dz=P.z-n.z,dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>160) continue;
    // Patrol
    if(n.state==='patrol'){
      var tx=n.patrolX-n.x,tz=n.patrolZ-n.z,td=Math.sqrt(tx*tx+tz*tz);
      if(td<2){n.patrolX=n.x+(Math.random()-.5)*35;n.patrolZ=n.z+(Math.random()-.5)*35;}
      else{n.x+=tx/td*n.speed*dt;n.z+=tz/td*n.speed*dt;n.rot=Math.atan2(tx,tz);}
    }
    // Alert
    if(n.type==='police'&&P.wanted>0&&dist<50)n.alertLvl=Math.min(100,n.alertLvl+dt*30);
    if(n.type==='gang'&&dist<20&&P.wanted>0)n.alertLvl=Math.min(100,n.alertLvl+dt*15);
    if(n.alertLvl>50)n.state='chase';
    if(n.alertLvl>80)n.state='attack';
    if(n.alertLvl>0)n.alertLvl=Math.max(0,n.alertLvl-dt*2);
    // Chase
    if(n.state==='chase'&&dist>2){n.x+=dx/dist*n.speed*1.6*dt;n.z+=dz/dist*n.speed*1.6*dt;n.rot=Math.atan2(dx,dz);}
    // Attack
    if(n.state==='attack'){
      if(dist>1.5){n.x+=dx/dist*n.speed*.8*dt;n.z+=dz/dist*n.speed*.8*dt;}
      n.rot=Math.atan2(dx,dz);n.shootCD-=dt;
      if(n.shootCD<=0&&dist<(n.weapon.range||4)){
        n.shootCD=.6+Math.random()*.8;
        if(dist<3&&n.weapon.range<=3){P.hp-=n.weapon.dmg*(1-P.armor*.006);showDmg();}
        else if(dist<n.weapon.range){
          var ang=n.rot+(Math.random()-.5)*.3;
          fireBullet(n.x,n.z,Math.sin(ang),Math.cos(ang),n.weapon,false);
        }
        if(P.hp<=0)killPlayer();
      }
    }
    // Civil flee
    if(n.type==='civil'&&dist<12&&P.wanted>1){n.x-=dx/dist*2.2*dt;n.z-=dz/dist*2.2*dt;}
    // Faction vs faction
    for(var j=0;j<npcs.length;j++){
      var o=npcs[j];if(o===n||o.dead)continue;
      if(!isEnemy(n.faction,o.faction))continue;
      var ex=o.x-n.x,ez=o.z-n.z,ed=Math.sqrt(ex*ex+ez*ez);
      if(ed<18&&ed>.5){
        n.state='attack';n.shootCD-=dt*.5;
        if(n.shootCD<=0&&ed<(n.weapon.range||4)){
          n.shootCD=.8+Math.random()*.6;
          if(Math.random()<.4){o.hp-=n.weapon.dmg;if(o.hp<=0)killNPC(o);}
        }
        if(ed>2){n.x+=ex/ed*n.speed*.5*dt;n.z+=ez/ed*n.speed*.5*dt;n.rot=Math.atan2(ex,ez);}
      }
    }
  }
}

function isEnemy(a,b){
  if(a===b||a==='civil'||b==='civil')return false;
  var e={biker:['balkan','russian'],balkan:['biker','white','russian'],
         russian:['biker','balkan'],white:['balkan','biker'],police:['biker','balkan','russian','white']};
  return e[a]&&e[a].indexOf(b)>=0;
}
function killNPC(n){
  n.dead=true;n.deathT=8;
  bloodDecals.push({x:n.x,z:n.z,r:.4+Math.random()*.4,alpha:.8});
  if(bloodDecals.length>60)bloodDecals.shift();
  if(P.missionActive){P.missionKills++;checkMissionProg();}
  if(Math.random()<.3)pickups.push({x:n.x,z:n.z,rot:0,data:{type:'weapon',wid:2+Math.floor(Math.random()*4)},alive:true});
}

var shootCD=0;
function checkShooting(dt){
  if(!firing||P.inVehicle)return;
  var w=P.weapons[P.weapon];shootCD-=dt;
  if(shootCD>0)return;
  shootCD=w.auto?.1:.4;
  if(w.ammo===0){showMsg('TOMT MAGASIN!');return;}
  if(w.ammo>0)w.ammo--;
  var ang=P.rot;
  if(mouseWX!==0||mouseWZ!==0){ang=Math.atan2(mouseWX-P.x,mouseWZ-P.z);}
  var dx=Math.sin(ang)+(Math.random()-.5)*.04;
  var dz=Math.cos(ang)+(Math.random()-.5)*.04;
  var len=Math.sqrt(dx*dx+dz*dz);
  if(w.range<=3){hitNear(P.x,P.z,w.range,w.dmg);}
  else{fireBullet(P.x,P.z,dx/len,dz/len,w,true);}
  addWanted(.02);updateWepHUD();
}

function fireBullet(x,z,dx,dz,weapon,fromP){
  bullets.push({x:x,z:z,dx:dx,dz:dz,speed:weapon.range*4,
    dmg:weapon.dmg,dist:0,maxDist:weapon.range,fromP:fromP,weapon:weapon});
}
function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];var mx2=b.dx*b.speed*dt,mz2=b.dz*b.speed*dt;
    b.x+=mx2;b.z+=mz2;b.dist+=Math.sqrt(mx2*mx2+mz2*mz2);
    var hit=false;
    if(b.fromP){
      for(var j=0;j<npcs.length;j++){
        var n=npcs[j];if(n.dead)continue;
        var ndx=n.x-b.x,ndz=n.z-b.z;
        if(Math.sqrt(ndx*ndx+ndz*ndz)<.8){
          n.hp-=b.dmg;bloodDecals.push({x:n.x,z:n.z,r:.3+Math.random()*.3,alpha:.7});
          if(n.hp<=0)killNPC(n);else{n.state='attack';n.alertLvl=100;}
          addWanted(.1);hit=true;break;
        }
      }
      // Hit vehicle
      for(var j=0;j<vehicles.length;j++){
        var v=vehicles[j];if(v===P.inVehicle)continue;
        if(Math.abs(b.x-v.x)<1.2&&Math.abs(b.z-v.z)<2.4){v.hp-=b.dmg;hit=true;break;}
      }
    } else {
      var pdx=P.x-b.x,pdz=P.z-b.z;
      if(Math.sqrt(pdx*pdx+pdz*pdz)<.7){P.hp-=b.dmg*(1-P.armor*.007);showDmg();hit=true;if(P.hp<=0)killPlayer();}
    }
    if(b.weapon.range<=8&&b.dist>b.maxDist*.4&&!hit){spawnExplosion(b.x,b.z,b.weapon.dmg);hit=true;}
    if(b.dist>b.maxDist||colTest(b.x,b.z,.2))hit=true;
    if(hit)bullets.splice(i,1);
  }
}
function hitNear(x,z,range,dmg){
  npcs.forEach(function(n){if(n.dead)return;var d=Math.sqrt((n.x-x)*(n.x-x)+(n.z-z)*(n.z-z));
    if(d<range){n.hp-=dmg;bloodDecals.push({x:n.x,z:n.z,r:.3,alpha:.7});if(n.hp<=0)killNPC(n);else n.state='attack';}});
}
function spawnExplosion(x,z,dmg){
  explosions.push({x:x,z:z,r:.5,maxR:8,t:1.5,maxT:1.5,dmg:dmg});
  npcs.forEach(function(n){if(n.dead)return;var d=Math.sqrt((n.x-x)*(n.x-x)+(n.z-z)*(n.z-z));
    if(d<8){n.hp-=dmg*(1-d/8);if(n.hp<=0)killNPC(n);}});
  var pd=Math.sqrt((P.x-x)*(P.x-x)+(P.z-z)*(P.z-z));
  if(pd<8){P.hp-=dmg*(1-pd/8)*(1-P.armor*.006);showDmg();}
}
function updateExplosions(dt){
  for(var i=explosions.length-1;i>=0;i--){
    var e=explosions[i];e.t-=dt;e.r=e.maxR*(1-e.t/e.maxT);
    if(e.t<=0)explosions.splice(i,1);
  }
}
function updatePickups(dt){
  for(var i=pickups.length-1;i>=0;i--){
    var pk=pickups[i];if(!pk.alive)continue;
    pk.rot+=dt*2;
    var dx=P.x-pk.x,dz=P.z-pk.z;
    if(Math.sqrt(dx*dx+dz*dz)<1.5){
      var d=pk.data;
      if(d.type==='health'&&P.hp<100){P.hp=Math.min(100,P.hp+40);showMsg('HÄLSA +40');}
      else if(d.type==='armor'){P.armor=Math.min(100,P.armor+50);showMsg('RUSTNING +50');}
      else if(d.type==='weapon')giveWep(d.wid);
      else if(d.type==='money'){P.money+=d.amt;showMsg('$ +'+d.amt);}
      pk.alive=false;pickups.splice(i,1);i--;
    }
  }
}
function giveWep(wid){
  for(var i=0;i<P.weapons.length;i++){
    if(P.weapons[i].name===WEAPONS[wid].name){P.weapons[i].ammo=Math.min(P.weapons[i].ammo+WEAPONS[wid].ammo,WEAPONS[wid].maxAmmo);showMsg(WEAPONS[wid].name+' AMMO +'+WEAPONS[wid].ammo);return;}
  }
  P.weapons.push(JSON.parse(JSON.stringify(WEAPONS[wid])));showMsg(WEAPONS[wid].name+' HITTAD!');
}
function updateMissionMarkers(dt){
  missionMarkers.forEach(function(m){m.rot+=dt*.8;});
  shopMarkers.forEach(function(m){});
  // Check proximity
  missionMarkers.forEach(function(m){
    if(!m.active)return;
    var dx=P.x-m.x,dz=P.z-m.z;
    if(Math.sqrt(dx*dx+dz*dz)<3.5&&!P.missionActive)startMission(m);
  });
  shopMarkers.forEach(function(m){
    var dx=P.x-m.x,dz=P.z-m.z;
    if(Math.sqrt(dx*dx+dz*dz)<3.5)openShop(m.shop);
  });
  // Mission target check
  if(P.missionActive){
    var ms=P.missionActive;
    var dx=P.x-ms.target.x,dz=P.z-ms.target.z;
    if(Math.sqrt(dx*dx+dz*dz)<5){
      if(ms.type==='deliver'||ms.type==='vehicle')completeMission();
    }
  }
}
function startMission(marker){
  P.missionActive=marker.mission;P.missionKills=0;marker.active=false;
  showDlg(marker.mission.giver,marker.mission.text);
  document.getElementById('obj-box').textContent='> '+marker.mission.obj;
  // Spawn target marker
  missionMarkers.push({x:marker.mission.target.x,z:marker.mission.target.z,
    mission:null,isTarget:true,rot:0,active:false});
}
function checkMissionProg(){
  if(!P.missionActive)return;
  var ms=P.missionActive;
  if(P.missionKills>=ms.kills&&ms.kills>0)completeMission();
}
function completeMission(){
  var ms=P.missionActive;P.money+=ms.reward;P.missionActive=null;P.missionKills=0;
  document.getElementById('obj-box').textContent='';
  showMsg('UPPDRAG KLART!\n$ +'+ms.reward);showDlg(ms.giver,'Bra jobbat. Pengarna är dina.');
  if(ms.reward>=2000)giveWep(7);else if(ms.reward>=1000)giveWep(5);
  addWanted(-.5);P.score+=ms.reward;
  // Remove target marker
  for(var i=missionMarkers.length-1;i>=0;i--){if(missionMarkers[i].isTarget){missionMarkers.splice(i,1);break;}}
}
function addWanted(amt){P.wanted=Math.max(0,Math.min(3,P.wanted+amt));P.wantedCD=15;
  if(P.wanted>0)npcs.forEach(function(n){if(n.type==='police')n.alertLvl=Math.min(100,P.wanted*40);});}
function updateWanted(dt){
  if(P.wantedCD>0){P.wantedCD-=dt;if(P.wantedCD<=0&&P.wanted>0)P.wanted=Math.max(0,P.wanted-.5);}
  P.wantedTimer+=dt;if(P.wantedTimer>20&&P.wanted>0){P.wantedTimer=0;P.wanted=Math.max(0,P.wanted-.25);}
}
function tryEnterVehicle(){
  if(P.inVehicle){exitVehicle();return;}
  for(var i=0;i<vehicles.length;i++){
    var v=vehicles[i];
    if(Math.sqrt((P.x-v.x)*(P.x-v.x)+(P.z-v.z)*(P.z-v.z))<4&&!v.occupied){
      P.inVehicle=v;v.occupied=true;showMsg('ENTRERAT '+v.type.toUpperCase());addWanted(.1);return;
    }
  }
  showMsg('INGEN BIL I NÄRHETEN');
}
function exitVehicle(){if(!P.inVehicle)return;P.inVehicle.occupied=false;P.x=P.inVehicle.x+2.5;P.z=P.inVehicle.z;P.inVehicle=null;document.getElementById('speed-hud').style.display='none';}
function interact(){

  shopMarkers.forEach(function(m){var d=Math.sqrt((P.x-m.x)*(P.x-m.x)+(P.z-m.z)*(P.z-m.z));if(d<3.5)openShop(m.shop);});
  npcs.forEach(function(n){var d=Math.sqrt((P.x-n.x)*(P.x-n.x)+(P.z-n.z)*(P.z-n.z));
    if(d<2.5&&n.type==='civil'){var amt=50+Math.floor(Math.random()*150);P.money+=amt;showMsg('RÅNADE CIVIL + $'+amt);addWanted(.3);}});
}
function cycleWep(dir){P.weapon=(P.weapon+dir+P.weapons.length)%P.weapons.length;updateWepHUD();showMsg(P.weapons[P.weapon].name);}

function respawn(){P.dead=false;P.hp=100;P.armor=0;P.money=Math.max(0,P.money-200);P.wanted=0;P.weapon=0;P.weapons=[JSON.parse(JSON.stringify(WEAPONS[0]))];P.x=0;P.z=0;pVel.x=0;pVel.z=0;var ds=document.getElementById('dead');ds.classList.remove('show');ds.style.display='none';document.getElementById('dead-t').style.display='none';document.getElementById('dead-s').style.display='none';document.getElementById('dead-b').style.display='none';showMsg('ARRESTERAD. $200 BÖTER.');updateWepHUD();}

// ═══════════════════════════════════════════════════
//  RENDERER — Pure Canvas 2D Isometric
// ═══════════════════════════════════════════════════
function drawRect(x,z,w,d,col,wy){
  wy=wy||0;
  var hw=w/2,hd=d/2;
  var tl=worldToScreen(x-hw,z-hd,wy);
  var tr=worldToScreen(x+hw,z-hd,wy);
  var br=worldToScreen(x+hw,z+hd,wy);
  var bl=worldToScreen(x-hw,z+hd,wy);
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
}
function drawBox(x,z,w,d,h,col){
  // Ground face
  drawRect(x,z,w,d,col,0);
  // Left wall (z-)
  var tl=worldToScreen(x-w/2,z-d/2,0),tr=worldToScreen(x+w/2,z-d/2,0);
  var tlt=worldToScreen(x-w/2,z-d/2,h),trt=worldToScreen(x+w/2,z-d/2,h);
  ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(trt.x,trt.y);ctx.lineTo(tlt.x,tlt.y);ctx.closePath();
  ctx.fillStyle=shadeCol(col,-30);ctx.fill();
  // Right wall (x+)
  var br=worldToScreen(x+w/2,z+d/2,0),brt=worldToScreen(x+w/2,z+d/2,h);
  ctx.beginPath();ctx.moveTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(brt.x,brt.y);ctx.lineTo(trt.x,trt.y);ctx.closePath();
  ctx.fillStyle=shadeCol(col,-15);ctx.fill();
  // Top face
  drawRect(x,z,w,d,shadeCol(col,18),h);
}
function drawCircle(x,z,r,col,wy){
  var p=worldToScreen(x,z,wy||0);
  ctx.beginPath();ctx.arc(p.x,p.y,r*cam.zoom*8,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
}
function drawLine(x1,z1,x2,z2,col,lw){
  var a=worldToScreen(x1,z1),b=worldToScreen(x2,z2);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.stroke();
}

// ── Draw NPC ───────────────────────────────────────
function drawNPC(n){
  if(n.dead){
    drawCircle(n.x,n.z,.4,'rgba(100,0,0,.5)');return;
  }
  var f=FACTIONS[n.faction]||FACTIONS.civil;
  // Shadow
  drawCircle(n.x,n.z,.35,'rgba(0,0,0,.4)');
  // Body box
  drawBox(n.x,n.z,.55,1.05,1.05,f.col);
  // Head
  drawBox(n.x,n.z,.45,.45,.45,f.acc);
  // HP bar if damaged
  if(n.hp<n.maxHp){
    var s=worldToScreen(n.x,n.z,1.8);
    ctx.fillStyle='#330000';ctx.fillRect(s.x-16,s.y-6,32,4);
    ctx.fillStyle='#cc2222';ctx.fillRect(s.x-16,s.y-6,32*(n.hp/n.maxHp),4);
  }
}

// ── Draw Vehicle ───────────────────────────────────
function drawVehicle(v){
  var col='#'+v.color.toString(16).padStart(6,'0');
  // Shadow
  drawCircle(v.x,v.z,1.8,'rgba(0,0,0,.35)');
  // Body (rotated)
  var cos=Math.cos(v.rot),sin=Math.sin(v.rot);
  function vpt(ox,oz){return worldToScreen(v.x+ox*cos-oz*sin,v.z+ox*sin+oz*cos,0);}
  // Draw as rotated rectangle manually
  var hw=1.1,hd=2.3;
  var corners=[vpt(-hw,-hd),vpt(hw,-hd),vpt(hw,hd),vpt(-hw,hd)];
  ctx.beginPath();ctx.moveTo(corners[0].x,corners[0].y);
  corners.forEach(function(c){ctx.lineTo(c.x,c.y);});ctx.closePath();
  ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=.5;ctx.stroke();
  // Roof
  var rh=.6,rhw=.85,rhd=1.2;
  var rc=[vpt(-rhw,-rhd),vpt(rhw,-rhd),vpt(rhw,rhd),vpt(-rhw,rhd)];
  ctx.beginPath();ctx.moveTo(rc[0].x,rc[0].y);rc.forEach(function(c){ctx.lineTo(c.x,c.y);});ctx.closePath();
  ctx.fillStyle=shadeCol(col,15);ctx.fill();
  // Headlights
  [-.6,.6].forEach(function(ox){var hl=vpt(ox,-2.4);ctx.beginPath();ctx.arc(hl.x,hl.y,3,0,Math.PI*2);ctx.fillStyle='#ffffaa';ctx.fill();});
  // Taillights
  [-.6,.6].forEach(function(ox){var tl=vpt(ox,2.4);ctx.beginPath();ctx.arc(tl.x,tl.y,2.5,0,Math.PI*2);ctx.fillStyle='#cc2200';ctx.fill();});
  // Police light
  if(v.type==='police'&&P.wanted>1){
    var sl=vpt(0,-0.2);ctx.beginPath();ctx.arc(sl.x,sl.y,5,0,Math.PI*2);
    ctx.fillStyle=Math.sin(Date.now()*.01)>0?'rgba(255,0,0,.8)':'rgba(0,0,255,.8)';ctx.fill();
  }
}

// ── Draw Player ────────────────────────────────────
function drawPlayer(){
  if(!P.inVehicle){
    var bob=Math.abs(Math.sin(P.bobT))*.12;
    drawCircle(P.x,P.z,.42,'rgba(0,0,0,.4)');
    drawBox(P.x,P.z,.62,1.1,1.1+bob,'#2233aa');
    drawBox(P.x,P.z,.5,.5,.5+bob,'#ddaa88');
    // Direction indicator
    var dx2=Math.sin(P.rot)*.9,dz2=Math.cos(P.rot)*.9;
    drawLine(P.x,P.z,P.x+dx2,P.z+dz2,'#4488ff',2);
  }
}

// ── Draw World ─────────────────────────────────────
function drawWorld(){
  // Ground
  drawRect(0,0,900,900,'#101014');
  // Water
  world.water.forEach(function(w){drawRect(w.x,w.z,w.w,w.d,'#071520');});
  // Parks
  world.parks.forEach(function(p){drawRect(p.x,p.z,p.w,p.d,'#0f1f0f');});
  // Roads
  world.roads.forEach(function(r){drawRect(r.x,r.z,r.w,r.d,'#141420');});
  // Road markings
  world.roads.forEach(function(r){
    var steps=r.h?Math.floor(r.w/20):Math.floor(r.d/20);
    for(var i=0;i<steps;i++){
      if(r.h)drawRect(r.x-r.w/2+i*20+10,r.z,.15,3,'#ddbb00');
      else drawRect(r.x,r.z-r.d/2+i*20+10,3,.15,'#ddbb00');
    }
  });
  // Sidewalks
  world.sidewalks.forEach(function(s){drawRect(s.x,s.z,s.w,s.d,'#1a1a26');});
  // Bridges
  world.bridges.forEach(function(b){
    var w=b.isNS?7:b.len,d=b.isNS?b.len:7;
    drawRect(b.x,b.z,w,d,'#303038');
    // Railings
    if(b.isNS){drawRect(b.x-3.2,b.z,.3,b.len,'#404048');drawRect(b.x+3.2,b.z,.3,b.len,'#404048');}
    else{drawRect(b.x,b.z-3.2,b.len,.3,'#404048');drawRect(b.x,b.z+3.2,b.len,.3,'#404048');}
  });
  // Territory
  world.markers.filter(function(m){return m.type==='territory';}).forEach(function(m){
    var p=worldToScreen(m.x,m.z);
    var grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,m.r*cam.zoom*8);
    grd.addColorStop(0,m.col);grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(p.x,p.y,m.r*cam.zoom*8,0,Math.PI*2);ctx.fill();
  });
  // Buildings (back to front using depth sort)
  var sorted=world.buildings.slice().sort(function(a,b){
    var da=a.z-a.d/2,db=b.z-b.d/2;return da-db;});
  sorted.forEach(function(b){
    if(Math.abs(b.x-cam.x)>150||Math.abs(b.z-cam.y)>150) return;
    drawBox(b.x,b.z,b.w,b.d,b.h,b.col);
    // Windows
    if(b.h>6){
      var floors=Math.floor(b.h/3.2);
      for(var f=1;f<floors;f++){
        var wy=f*3.2;
        if(Math.random()<.003){
          var s=worldToScreen(b.x,b.z-b.d/2-.1,wy+1);
          ctx.fillStyle=Math.random()<.4?'#ffeeaa':'#223344';
          ctx.fillRect(s.x-3,s.y-3,6,4);
        }
      }
    }
  });
  // Street lights
  world.lights.forEach(function(l){
    drawRect(l.x,l.z,.2,6,'#444450');
    var grd2=ctx.createRadialGradient(0,0,0,0,0,20*cam.zoom);
    var lp=worldToScreen(l.x,l.z,5.5);
    var grd3=ctx.createRadialGradient(lp.x,lp.y,0,lp.x,lp.y,20*cam.zoom);
    grd3.addColorStop(0,'rgba(255,255,180,.15)');grd3.addColorStop(1,'transparent');
    ctx.fillStyle=grd3;ctx.beginPath();ctx.arc(lp.x,lp.y,20*cam.zoom,0,Math.PI*2);ctx.fill();
    drawCircle(l.x,l.z,.28,'#ffffbb',5.5);
  });
  // Subway entrances
  world.subway.forEach(function(s){
    drawBox(s.x,s.z,4,4,2.5,'#1a2244');
    var grd=worldToScreen(s.x,s.z,3);
    ctx.fillStyle=s.col;ctx.fillRect(grd.x-8,grd.y-5,16,3);
    // T sign
    ctx.fillStyle=s.col;ctx.beginPath();
    var tp=worldToScreen(s.x,s.z,3.5);ctx.arc(tp.x,tp.y,5*cam.zoom,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold '+(5*cam.zoom)+'px Courier New';ctx.textAlign='center';
    ctx.fillText('T',tp.x,tp.y+2);ctx.textAlign='left';
  });
}

// ── Draw bullets, explosions, blood ───────────────
function drawFX(){
  // Blood decals
  bloodDecals.forEach(function(b){
    drawCircle(b.x,b.z,b.r,'rgba(80,0,0,'+b.alpha+')');
  });
  // Bullets
  bullets.forEach(function(b){
    var p=worldToScreen(b.x,b.z);
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);
    ctx.fillStyle=b.fromP?'#ffff44':'#ff4422';ctx.fill();
  });
  // Explosions
  explosions.forEach(function(e){
    var p=worldToScreen(e.x,e.z);
    var prog=1-e.t/e.maxT;
    var grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,e.r*cam.zoom*8);
    grd.addColorStop(0,'rgba(255,200,50,'+(1-prog)+')');
    grd.addColorStop(.5,'rgba(255,80,10,'+(1-prog)*.8+')');
    grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;ctx.beginPath();ctx.arc(p.x,p.y,e.r*cam.zoom*8,0,Math.PI*2);ctx.fill();
  });
  // Mission markers
  missionMarkers.forEach(function(m){
    if(!m.active&&!m.isTarget)return;
    var p=worldToScreen(m.x,m.z,1.5+Math.sin(Date.now()*.003)*.4);
    var col=m.isTarget?'rgba(255,50,50,.9)':'rgba(255,220,0,.9)';
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,8*cam.zoom,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,4*cam.zoom,0,Math.PI*2);ctx.fill();
    // Beam
    var base=worldToScreen(m.x,m.z,0);
    ctx.strokeStyle=m.isTarget?'rgba(255,50,50,.3)':'rgba(255,220,0,.3)';
    ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(base.x,base.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  });
  // Shop markers
  shopMarkers.forEach(function(m){
    var p=worldToScreen(m.x,m.z,2+Math.sin(Date.now()*.004)*.3);
    ctx.strokeStyle=m.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,9*cam.zoom,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=m.col;ctx.font='bold '+(6*cam.zoom)+'px Courier New';ctx.textAlign='center';
    ctx.fillText('$',p.x,p.y+2);ctx.textAlign='left';
  });
  // Weapon pickups
  pickups.forEach(function(pk){
    if(!pk.alive)return;
    var d=pk.data;
    var col=d.type==='health'?'#cc2222':d.type==='armor'?'#22aacc':d.type==='money'?'#ffdd44':'#888888';
    var p=worldToScreen(pk.x,pk.z,.8+Math.sin(Date.now()*.005+pk.x)*.3);
    ctx.strokeStyle=col;ctx.lineWidth=1.5;
    var s=6*cam.zoom;
    ctx.strokeRect(p.x-s/2,p.y-s/2,s,s);
    ctx.fillStyle=col+'44';ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
  });
}

// ── Minimap update ─────────────────────────────────
function drawMinimap(){
  var ms=130,sc=ms/280;
  var px=P.inVehicle?P.inVehicle.x:P.x,pz=P.inVehicle?P.inVehicle.z:P.z;
  mmCtx.clearRect(0,0,ms,ms);
  if(mmCache)mmCtx.drawImage(mmCache,0,0);
  else{mmCtx.fillStyle='#06080e';mmCtx.fillRect(0,0,ms,ms);}
  var cx=ms/2,cy=ms/2;
  function wx(x){return cx+(x-px)*sc;}function wy(z){return cy+(z-pz)*sc;}
  // Territories
  [{x:-120,z:-20,r:50,c:'rgba(255,100,0,.12)'},{x:0,z:0,r:60,c:'rgba(200,0,0,.09)'},
   {x:40,z:-40,r:45,c:'rgba(220,170,0,.09)'},{x:20,z:-120,r:50,c:'rgba(100,100,200,.09)'}].forEach(function(t){
    mmCtx.fillStyle=t.c;mmCtx.beginPath();mmCtx.arc(wx(t.x),wy(t.z),t.r*sc,0,Math.PI*2);mmCtx.fill();});
  // NPCs
  npcs.forEach(function(n){if(n.dead)return;var f=FACTIONS[n.faction];
    mmCtx.fillStyle=f?f.acc:'#aaa';mmCtx.fillRect(wx(n.x)-1.5,wy(n.z)-1.5,3,3);});
  // Vehicles
  mmCtx.fillStyle='#ffffff33';vehicles.forEach(function(v){mmCtx.fillRect(wx(v.x)-2.5,wy(v.z)-1.5,5,3);});
  // Mission markers
  missionMarkers.forEach(function(m){if(!m.active&&!m.isTarget)return;
    mmCtx.fillStyle=m.isTarget?'#ff2222':'#ffdd00';mmCtx.fillRect(wx(m.x)-3,wy(m.z)-3,6,6);});
  // Wanted border
  if(P.wanted>1){mmCtx.strokeStyle='#ff2222';mmCtx.lineWidth=2;mmCtx.strokeRect(1,1,ms-2,ms-2);}
  // Player
  mmCtx.fillStyle='#ffdd44';mmCtx.beginPath();mmCtx.arc(cx,cy,4.5,0,Math.PI*2);mmCtx.fill();
  var pr=P.inVehicle?P.inVehicle.rot:P.rot;
  mmCtx.strokeStyle='#ffdd44';mmCtx.lineWidth=1.5;mmCtx.beginPath();
  mmCtx.moveTo(cx,cy);mmCtx.lineTo(cx+Math.sin(pr)*8,cy+Math.cos(pr)*8);mmCtx.stroke();
  mmCtx.strokeStyle='#ffffff18';mmCtx.lineWidth=1;mmCtx.strokeRect(0,0,ms,ms);
}

// ── Fog / atmosphere overlay ───────────────────────
function drawAtmosphere(){
  // Vignette
  var vgrd=ctx.createRadialGradient(C.width/2,C.height/2,C.height*.2,C.width/2,C.height/2,C.height*.85);
  vgrd.addColorStop(0,'transparent');vgrd.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vgrd;ctx.fillRect(0,0,C.width,C.height);
}

// ── Scanlines ──────────────────────────────────────
function drawScanlines(){
  ctx.globalAlpha=.02;ctx.fillStyle='#000000';
  for(var y=0;y<C.height;y+=3)ctx.fillRect(0,y,C.width,1);
  ctx.globalAlpha=1;
}

// ═══════════════════════════════════════════════════
//  MOBILE CONTROLS
// ═══════════════════════════════════════════════════
function setupMobile(){
  if(!('ontouchstart' in window))return;
  document.getElementById('mobile').style.display='block';
  setupJoy('jL','jLk',jL);setupJoy('jR','jRk',jR);
  document.getElementById('bFire').addEventListener('touchstart',function(e){e.preventDefault();firing=true;},{passive:false});
  document.getElementById('bFire').addEventListener('touchend',function(){firing=false;});
  document.getElementById('bRun').addEventListener('touchstart',function(e){e.preventDefault();sprinting=true;},{passive:false});
  document.getElementById('bRun').addEventListener('touchend',function(){sprinting=false;});
  document.getElementById('bCar').addEventListener('touchstart',function(e){e.preventDefault();tryEnterVehicle();},{passive:false});
  document.getElementById('bCam').addEventListener('touchstart',function(e){e.preventDefault();toggleCam();},{passive:false});
  document.getElementById('bWep').addEventListener('touchstart',function(e){e.preventDefault();cycleWep(1);},{passive:false});
}
function setupJoy(bi,ki,out){
  var b=document.getElementById(bi),k=document.getElementById(ki),active=false,sx=0,sy=0,mr=34;
  b.addEventListener('touchstart',function(e){e.preventDefault();active=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
  b.addEventListener('touchmove',function(e){e.preventDefault();if(!active)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    var dist=Math.min(Math.sqrt(dx*dx+dy*dy),mr),ang=Math.atan2(dy,dx);
    k.style.transform='translate('+(dist*Math.cos(ang))+'px,'+(dist*Math.sin(ang))+'px)';
    out.x=dx/mr;out.y=dy/mr;var mg=Math.sqrt(out.x*out.x+out.y*out.y);
    if(mg>1){out.x/=mg;out.y/=mg;}
  },{passive:false});
  b.addEventListener('touchend',function(){active=false;out.x=0;out.y=0;k.style.transform='';});
}

// ═══════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;frameN++;

  if(frameN%150===0&&npcs.length<80){
    var ang=Math.random()*Math.PI*2,dist=65+Math.random()*30;
    var fArr=['civil','civil','civil','biker','balkan','russian','white','police'];
    var f=fArr[Math.floor(Math.random()*fArr.length)];
    makeNPC(P.x+Math.cos(ang)*dist,P.z+Math.sin(ang)*dist,f,f==='police'?'police':f==='civil'?'civil':'gang');
  }
  if(frameN%400===0){
    for(var i=npcs.length-1;i>=0;i--){var n=npcs[i];var d=Math.sqrt((n.x-P.x)*(n.x-P.x)+(n.z-P.z)*(n.z-P.z));if(d>180&&!n.dead){npcs.splice(i,1);}}
  }
  if(frameN%600===0)pickups.push({x:(Math.random()-.5)*180,z:(Math.random()-.5)*180,rot:0,data:{type:'weapon',wid:2+Math.floor(Math.random()*5)},alive:true});

  update(dt);

  // Render
  try {
  ctx.clearRect(0,0,C.width,C.height);
  ctx.fillStyle='#050508';ctx.fillRect(0,0,C.width,C.height);

  // Sort objects by z for painter's algorithm
  var drawItems=[];
  npcs.forEach(function(n){drawItems.push({z:n.z,type:'npc',obj:n});});
  vehicles.forEach(function(v){drawItems.push({z:v.z,type:'vehicle',obj:v});});
  drawItems.sort(function(a,b){return a.z-b.z;});

  drawWorld();
  drawFX();
  drawItems.forEach(function(item){
    if(item.type==='npc')drawNPC(item.obj);
    else drawVehicle(item.obj);
  });
  drawPlayer();
  drawAtmosphere();
  drawScanlines();
  drawMinimap();
  updateHUD();
  } catch(err) {
    ctx.fillStyle='#050508';ctx.fillRect(0,0,C.width,C.height);
    ctx.fillStyle='#ff4444';ctx.font='12px monospace';
    ctx.fillText('ERR: '+err.message, 20, C.height/2);
  }
}
